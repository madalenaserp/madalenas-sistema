<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  form.cartao { display:flex; flex-direction:column; gap:8px; }
  select, input[type=password] { font-size:16px; padding:6px 8px; border:1px solid var(--linha); border-radius:8px; background:var(--cartao); }
  .pessoa { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .pessoa button { font-size:14px; padding:6px 10px; border-radius:8px; border:1px solid var(--linha); background:var(--cartao); cursor:pointer; }
</style>
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Equipe e acessos</h1><a href="rh.html">Voltar</a></header>
<main>
  <form class="cartao" id="novo">
    <h2>Criar login</h2>
    <select id="pessoa" required></select>
    <input type="text" id="usuario" placeholder="Usuário (ex.: jessica)" autocapitalize="none" required pattern="[a-z0-9]+">
    <input type="password" id="senha" placeholder="Senha provisória (mínimo 6)" minlength="6" required autocomplete="new-password">
    <select id="papel">
      <option value="equipe">Equipe (só as próprias tarefas)</option>
      <option value="lider">Líder (marca presença)</option>
      <option value="gestor">Gestor (vê tudo, não lança nada)</option>
    </select>
    <p class="suave" id="msg" style="margin:0"></p>
    <button class="botao principal" type="submit">Criar login</button>
  </form>
  <div class="cartao"><h2>Logins criados</h2><div id="lista" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div></div>
</main>
<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, DOMINIO } from "./js/sessao.js";
import { EQUIPE, pode } from "./js/equipe.js";
import { firebase } from "./js/firebase.js";
import { firebaseConfig } from "./js/config.js";

const eu = await exigirUsuario();
if (!pode.gerirEquipe(eu)) location.href = "turno.html";
const f = await firebase();
const SDK = "https://www.gstatic.com/firebasejs/10.12.2";

const ROTULO = { dona: "Dona", gestor: "Gestor", lider: "Líder", equipe: "Equipe" };
const selPessoa = document.getElementById("pessoa");
const campoUsuario = document.getElementById("usuario");
const msg = document.getElementById("msg");

async function carregar() {
  const snap = await f.fs.getDocs(f.fs.collection(f.db, "usuarios"));
  const usuarios = snap.docs.map((d) => ({ uid: d.id, ...d.data() }));
  const comLogin = new Set(usuarios.filter((u) => u.ativo !== false).map((u) => u.nome)); // desativado pode ganhar login novo
  selPessoa.innerHTML = `<option value="">Escolha a pessoa…</option>` +
    EQUIPE.filter((p) => !comLogin.has(p.nome)).map((p) => `<option>${p.nome}</option>`).join("");
  const lista = document.getElementById("lista");
  const ativos = usuarios.filter((u) => u.ativo !== false), desativados = usuarios.filter((u) => u.ativo === false);
  lista.innerHTML = ativos.length ? "" : `<p class="suave">Nenhum ainda.</p>`;
  // Desativados ficam escondidos (o histórico de quem foi desativado não se apaga).
  const caixaDesat = document.createElement("details");
  caixaDesat.innerHTML = `<summary class="suave" style="font-size:13px">Logins desativados (${desativados.length})</summary>`;
  for (const u of [...ativos, ...desativados].sort((a, b) => a.nome.localeCompare(b.nome))) {
    const linha = document.createElement("div");
    linha.className = "pessoa";
    linha.innerHTML = `<span><b>${u.nome}</b> <span class="suave">· ${u.usuario} · ${ROTULO[u.papel] || u.papel}${u.ativo === false ? " · desativado" : ""}${u.trocarSenha ? " · vai escolher a senha no próximo acesso" : ""}</span></span>`;
    if (u.uid !== eu.uid) {
      const b = document.createElement("button");
      b.textContent = u.ativo === false ? "Reativar" : "Desativar";
      b.onclick = async () => {
        if (u.ativo !== false && !confirm(`Desativar o login "${u.usuario}" de ${u.nome}? Ele para de funcionar na hora.`)) return;
        await f.fs.updateDoc(f.fs.doc(f.db, "usuarios", u.uid), { ativo: u.ativo === false });
        carregar();
      };
      linha.append(b);
      if (u.ativo !== false && !u.trocarSenha) {
        const t = document.createElement("button");
        t.textContent = "Pedir nova senha";
        t.title = "No próximo acesso, a pessoa escolhe uma senha nova";
        t.onclick = async () => { await f.fs.updateDoc(f.fs.doc(f.db, "usuarios", u.uid), { trocarSenha: true }); carregar(); };
        linha.append(t);
      }
    }
    (u.ativo === false ? caixaDesat : lista).append(linha);
  }
  if (desativados.length) lista.append(caixaDesat);
}

selPessoa.onchange = () => {
  const p = EQUIPE.find((x) => x.nome === selPessoa.value);
  if (p) { campoUsuario.value = p.usuario; document.getElementById("papel").value = p.papel === "dona" ? "gestor" : p.papel; }
};

// Cria a conta numa segunda conexão, para a Daiane não ser desconectada.
async function criarConta(email, senha) {
  const { initializeApp, deleteApp } = await import(`${SDK}/firebase-app.js`);
  const app2 = initializeApp(firebaseConfig, `criar-${Date.now()}`);
  try {
    const conta2 = f.auth.getAuth(app2);
    const cred = await f.auth.createUserWithEmailAndPassword(conta2, email, senha);
    await f.auth.signOut(conta2);
    return cred.user.uid;
  } finally { await deleteApp(app2); }
}

document.getElementById("novo").onsubmit = async (e) => {
  e.preventDefault();
  const p = EQUIPE.find((x) => x.nome === selPessoa.value);
  const usuario = campoUsuario.value.trim().toLowerCase();
  const botao = e.submitter; botao.disabled = true; msg.textContent = "Criando…";
  try {
    const uid = await criarConta(`${usuario}@${DOMINIO}`, document.getElementById("senha").value);
    await f.fs.setDoc(f.fs.doc(f.db, "usuarios", uid), {
      nome: p.nome, usuario, setor: p.setor, papel: document.getElementById("papel").value, ativo: true, trocarSenha: true,
      criadoPor: eu.nome, criadoEm: new Date().toISOString(),
    });
    msg.textContent = `Pronto. ${p.nome} entra com o usuário "${usuario}" e a senha provisória; no primeiro acesso o sistema pede para ela escolher a própria senha.`;
    e.target.reset();
    carregar();
  } catch (err) {
    if (err.code === "auth/email-already-in-use") {
      // O login antigo (desativado) continua reservado no Firebase: sugere o mesmo nome com um número.
      const n = (usuario.match(/(\d+)$/)?.[1] | 0) + 1 || 2;
      campoUsuario.value = usuario.replace(/\d+$/, "") + Math.max(n, 2);
      msg.textContent = `O usuário "${usuario}" já existe. Sugeri "${campoUsuario.value}"; toque em Criar login de novo.`;
    } else msg.textContent = `Não consegui criar (${err.code || err.message}).`;
  } finally { botao.disabled = false; }
};

carregar();
</script>
</body>
</html>
