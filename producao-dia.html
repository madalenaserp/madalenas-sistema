<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Produção do dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  [hidden] { display:none !important; }
  .abas { display:flex; gap:6px; }
  .abas button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--linha); background:var(--cartao); font-size:15px; cursor:pointer; }
  .abas button[aria-pressed="true"] { background:var(--marca); color:#fff; border-color:var(--marca); }
  .lote { background:var(--cartao); border:1px solid var(--linha); border-left:4px solid var(--laranja); border-radius:12px; padding:10px 14px; display:flex; flex-direction:column; gap:3px; font-size:14px; }
  .lote.cancelado { opacity:.5; }
  .lote.cancelado .prod { text-decoration:line-through; }
  .lote .prod { font-size:17px; font-weight:700; }
  .lote button { align-self:flex-start; font-size:13px; padding:4px 10px; border-radius:8px; border:1px solid var(--linha); background:#fff; color:var(--suave); cursor:pointer; }
  .fundo-folha { position:fixed; inset:0; background:#0006; display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .folha { background:var(--cartao); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; max-height:92vh; overflow-y:auto; }
  .folha h2 { margin:0; font-size:19px; }
  .folha label.rot { font-size:14px; color:var(--suave); margin-bottom:-4px; }
  .folha input[type=text], .folha input[inputmode] { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; box-sizing:border-box; }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opcoes { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .opcoes.tres { grid-template-columns:1fr 1fr 1fr; }
  .opcoes button { padding:11px 6px; border-radius:10px; border:1px solid var(--linha); background:#fff; font-size:14px; cursor:pointer; }
  .opcoes button[aria-pressed="true"] { background:var(--laranja); color:#fff; border-color:var(--laranja); font-weight:600; }
  .msg-erro { color:var(--alerta); font-size:14px; margin:0; min-height:1em; }
  table.mes { width:100%; border-collapse:collapse; font-size:14px; }
  table.mes th, table.mes td { text-align:left; padding:7px 4px; border-bottom:1px solid var(--linha); }
  table.mes .n { text-align:right; white-space:nowrap; }
  .ruim { color:var(--alerta); font-weight:700; }
</style>
<script src="https://browser.sentry-cdn.com/11.1.0/bundle.min.js" crossorigin="anonymous"></script>
<script src="js/sentry.js"></script>
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Produção do dia</h1><a href="producao.html">Voltar</a></header>
<main>
  <div class="abas" id="abas" hidden>
    <button aria-pressed="true" data-aba="dia">Dia</button>
    <button aria-pressed="false" data-aba="mes">Resumo do mês</button>
  </div>
  <section id="aba-dia" style="display:flex;flex-direction:column;gap:10px">
    <div class="cartao">
      <div class="campo" style="margin:0">Dia <input type="date" id="dia"></div>
      <p class="suave" id="resumo" style="margin:8px 0 0"></p>
    </div>
    <button class="botao principal" id="novo">+ Registrar produção</button>
    <div class="cartao" id="comparar" hidden></div>
    <div id="lista" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <section id="aba-mes" hidden>
    <div class="cartao">
      <div class="campo" style="margin:0">Mês <input type="month" id="mes"></div>
      <div id="tabela" style="margin-top:8px"></div>
    </div>
  </section>
</main>
<div class="fundo-folha" id="fundo" hidden><div class="folha" id="folha"></div></div>
<datalist id="produtos"></datalist>

<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, hoje, dataBR } from "./js/sessao.js";
import { pode, EQUIPE } from "./js/equipe.js";
import { acrescentar, listar } from "./js/db.js";
import { PRODUTOS_PRODUCAO as PRODUTOS, UNIDADES, chaveProduto } from "./js/produtos.js";

const eu = await exigirUsuario();
if (!pode.producao(eu)) location.href = "turno.html";
const lanca = pode.lancarProducao(eu);
const podeCancelar = eu.papel === "dona";
const veMes = pode.verPainel(eu);

const ONDE = ["Panificadora", "Confeitaria"];
const PESSOAS = EQUIPE.filter((p) => ["Produção", "Confeitaria"].includes(p.setor)).map((p) => p.nome);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const agora = () => new Date().toTimeString().slice(0, 5);
const numero = (t) => Number(String(t).replace(",", "."));
const n = (v) => String(Math.round(v * 100) / 100).replace(".", ",");
const campoDia = document.getElementById("dia");
campoDia.value = hoje();
document.getElementById("produtos").innerHTML = PRODUTOS.map((p) => `<option value="${p}">`).join("");

// Cancelamento é um registro novo; nada se apaga.
function validos(regs, tipo) {
  const canc = Object.fromEntries(regs.filter((r) => r.tipo === "cancelamento").map((r) => [r.refId, r]));
  return regs.filter((r) => r.tipo === tipo).map((r) => ({ ...r, cancelamento: canc[r.id] }));
}
// Junta produzido e perdido por produto (mesmo nome e mesma unidade).
function comparar(lotes, perdas) {
  const t = {};
  const linha = (r) => (t[chaveProduto(r.produto, r.unidade)] ||= { produto: r.produto, unidade: r.unidade, feito: 0, perdido: 0, lixo: 0 });
  for (const r of lotes) linha(r).feito += Number(r.quantidade) || 0;
  for (const r of perdas) { const l = linha(r); l.perdido += Number(r.quantidade) || 0; if (r.destino === "lixo") l.lixo += Number(r.quantidade) || 0; }
  return Object.values(t).map((l) => ({ ...l, pct: l.feito ? (l.perdido / l.feito) * 100 : null }));
}
function tabela(linhas) {
  return `<table class="mes"><tr><th>Produto</th><th class="n">Feito</th><th class="n">Perdido</th><th class="n">%</th></tr>
    ${linhas.sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1) || b.feito - a.feito).map((l) => `<tr><td><b>${esc(l.produto)}</b> <span class="suave">(${esc(l.unidade)})</span></td>
      <td class="n">${n(l.feito)}</td><td class="n">${n(l.perdido)}${l.lixo ? ` <span class="suave">(${n(l.lixo)} lixo)</span>` : ""}</td>
      <td class="n ${l.pct >= 10 ? "ruim" : ""}">${l.pct == null ? "—" : `${Math.round(l.pct)}%`}</td></tr>`).join("")}</table>
    <p class="suave" style="margin:6px 0 0;font-size:13px">"—" quer dizer que teve perda mas ninguém registrou a produção desse produto. Em vermelho: perda de 10% ou mais.</p>`;
}

async function mostrar() {
  const d = campoDia.value;
  const lotes = validos(await listar("producao", "data", d), "producao").sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
  const ok = lotes.filter((r) => !r.cancelamento);
  const perdas = validos(await listar("perdas", "data", d), "perda").filter((r) => !r.cancelamento);
  document.getElementById("resumo").textContent = `${dataBR(d)} · ${ok.length} registro(s) de produção · ${perdas.length} de perda`;
  document.getElementById("novo").hidden = !lanca || d !== hoje();
  const comp = document.getElementById("comparar");
  comp.hidden = !ok.length && !perdas.length;
  comp.innerHTML = `<h2 style="margin:0 0 6px">Feito x perdido</h2>${tabela(comparar(ok, perdas))}`;
  const lista = document.getElementById("lista");
  lista.innerHTML = lotes.length ? "" : `<p class="suave">Nenhuma produção registrada neste dia.</p>`;
  for (const r of lotes) {
    const div = document.createElement("div");
    div.className = "lote" + (r.cancelamento ? " cancelado" : "");
    div.innerHTML = `<span class="prod">${esc(r.produto)} · ${esc(n(r.quantidade))} ${esc(r.unidade)}</span>
      <span>${esc(r.onde)} · feito por ${esc(r.quem.join(", "))}</span>
      ${r.obs ? `<span class="suave">${esc(r.obs)}</span>` : ""}
      <span class="suave">Registrado por ${esc(r.registradoPor)} às ${esc(r.hora)}</span>
      ${r.cancelamento ? `<span class="suave">Cancelado por ${esc(r.cancelamento.registradoPor)}: ${esc(r.cancelamento.motivo)}</span>` : ""}`;
    if (!r.cancelamento && podeCancelar) {
      const b = document.createElement("button"); b.textContent = "Cancelar";
      b.onclick = async () => {
        const m = prompt("Por que cancelar este registro?"); if (!m?.trim()) return;
        await acrescentar("producao", { tipo: "cancelamento", refId: r.id, motivo: m.trim(), data: r.data, mes: r.mes, hora: agora(),
          registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() }).catch(() => alert("Não consegui salvar."));
        mostrar();
      };
      div.append(b);
    }
    lista.append(div);
  }
}

/* ---------- Registrar ---------- */
const fundo = document.getElementById("fundo");
const folha = document.getElementById("folha");
fundo.onclick = (e) => { if (e.target === fundo) fundo.hidden = true; };
const botoes = (id, lista, classe = "") => `<div class="opcoes ${classe}" id="${id}">${lista.map((k) => `<button type="button" data-v="${esc(k)}" aria-pressed="false">${esc(k)}</button>`).join("")}</div>`;

function abrir() {
  const sel = { unidade: "unidade", onde: eu.setor === "Confeitaria" ? "Confeitaria" : "Panificadora", quem: PESSOAS.includes(eu.nome) ? [eu.nome] : [] };
  folha.innerHTML = `<h2>Registrar produção</h2>
    <label class="rot" for="f-prod">Produto</label>
    <input type="text" id="f-prod" list="produtos" placeholder="Ex.: Pão francês" autocomplete="off">
    <div class="duas">
      <div style="display:flex;flex-direction:column;gap:6px"><label class="rot" for="f-qtd">Quantidade</label><input id="f-qtd" inputmode="decimal" placeholder="0"></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label class="rot">Unidade</label>${botoes("f-un", UNIDADES)}</div>
    </div>
    <label class="rot">Onde</label>${botoes("f-onde", ONDE)}
    <label class="rot">Quem fez (pode marcar mais de um)</label>${botoes("f-quem", PESSOAS, "tres")}
    <input type="text" id="f-obs" placeholder="Observação (opcional)" autocomplete="off">
    <p class="msg-erro" id="f-erro"></p>
    <button class="botao principal" id="f-ok">Salvar</button>
    <button class="botao" id="f-x" style="text-align:center;border:none">Cancelar</button>`;
  const pinta = (id, ativo) => folha.querySelectorAll(`${id} button`).forEach((b) => b.setAttribute("aria-pressed", ativo(b.dataset.v)));
  const um = (id, chave) => {
    folha.querySelector(id).onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (v) { sel[chave] = v; pinta(id, (x) => x === sel[chave]); } };
    pinta(id, (x) => x === sel[chave]);
  };
  um("#f-un", "unidade"); um("#f-onde", "onde");
  folha.querySelector("#f-quem").onclick = (e) => {
    const v = e.target.closest("button")?.dataset.v; if (!v) return;
    sel.quem = sel.quem.includes(v) ? sel.quem.filter((x) => x !== v) : [...sel.quem, v];
    pinta("#f-quem", (x) => sel.quem.includes(x));
  };
  pinta("#f-quem", (x) => sel.quem.includes(x));
  folha.querySelector("#f-x").onclick = () => { fundo.hidden = true; };
  folha.querySelector("#f-ok").onclick = async (e) => {
    const erro = folha.querySelector("#f-erro");
    const produto = folha.querySelector("#f-prod").value.trim();
    const quantidade = numero(folha.querySelector("#f-qtd").value);
    if (!produto) return (erro.textContent = "Escreva o produto.");
    if (!(quantidade > 0)) return (erro.textContent = "Coloque a quantidade.");
    if (!sel.quem.length) return (erro.textContent = "Marque quem fez.");
    e.target.disabled = true;
    try {
      const d = hoje();
      await acrescentar("producao", { tipo: "producao", produto, quantidade, unidade: sel.unidade, onde: sel.onde, quem: sel.quem,
        obs: folha.querySelector("#f-obs").value.trim(), data: d, mes: d.slice(0, 7), hora: agora(),
        registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() });
      fundo.hidden = true; campoDia.value = d; mostrar();
    } catch { erro.textContent = "Não consegui salvar. Verifique a internet e tente de novo."; e.target.disabled = false; }
  };
  fundo.hidden = false;
}
document.getElementById("novo").onclick = abrir;
campoDia.onchange = mostrar;

/* ---------- Resumo do mês (Daiane e Fábio) ---------- */
const campoMes = document.getElementById("mes");
campoMes.value = hoje().slice(0, 7);
async function mostrarMes() {
  const lotes = validos(await listar("producao", "mes", campoMes.value), "producao").filter((r) => !r.cancelamento);
  const perdas = validos(await listar("perdas", "mes", campoMes.value), "perda").filter((r) => !r.cancelamento);
  document.getElementById("tabela").innerHTML = lotes.length || perdas.length ? tabela(comparar(lotes, perdas)) : `<p class="suave">Nada registrado neste mês.</p>`;
}
campoMes.onchange = mostrarMes;
if (veMes) {
  const abas = document.getElementById("abas");
  abas.hidden = false;
  abas.onclick = (e) => {
    const aba = e.target.closest("button")?.dataset.aba; if (!aba) return;
    abas.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.aba === aba));
    document.getElementById("aba-dia").hidden = aba !== "dia";
    document.getElementById("aba-mes").hidden = aba !== "mes";
    if (aba === "mes") mostrarMes();
  };
}
mostrar();
</script>
</body>
</html>
