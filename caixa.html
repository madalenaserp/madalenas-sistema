<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Saídas do caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  [hidden] { display:none !important; }
  .abas { display:flex; gap:6px; }
  .abas button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--linha); background:var(--cartao); font-size:15px; cursor:pointer; }
  .abas button[aria-pressed="true"] { background:var(--marca); color:#fff; border-color:var(--marca); }
  .mov { background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:12px 14px; display:flex; gap:10px; }
  .mov.cancelada { opacity:.5; }
  .mov.cancelada .prod { text-decoration:line-through; }
  .mov img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--linha); cursor:zoom-in; background:#eee; flex-shrink:0; }
  .mov .info { display:flex; flex-direction:column; gap:3px; flex:1; font-size:14px; }
  .mov .prod { font-size:17px; font-weight:700; }
  .mov button { align-self:flex-start; font-size:13px; padding:4px 10px; border-radius:8px; border:1px solid var(--linha); background:#fff; color:var(--suave); cursor:pointer; }
  .fundo-folha { position:fixed; inset:0; background:#0006; display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .folha { background:var(--cartao); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; max-height:92vh; overflow-y:auto; }
  .folha h2 { margin:0; font-size:19px; }
  .folha label.rot { font-size:14px; color:var(--suave); margin-bottom:-4px; }
  .folha input[type=text], .folha input[inputmode] { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; box-sizing:border-box; }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opcoes { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .opcoes.tres { grid-template-columns:1fr 1fr 1fr; }
  .opcoes button { padding:11px 6px; border-radius:10px; border:1px solid var(--linha); background:#fff; font-size:14px; cursor:pointer; }
  .opcoes button[aria-pressed="true"] { background:var(--laranja); color:#fff; border-color:var(--laranja); font-weight:600; }
  .camera { display:flex; align-items:center; gap:10px; border:1px dashed var(--linha); border-radius:10px; padding:10px; cursor:pointer; font-size:15px; }
  .camera input { display:none; }
  .camera img { width:64px; height:64px; object-fit:cover; border-radius:8px; }
  .msg-erro { color:var(--alerta); font-size:14px; margin:0; min-height:1em; }
  table.mes { width:100%; border-collapse:collapse; font-size:14px; }
  table.mes th, table.mes td { text-align:left; padding:7px 4px; border-bottom:1px solid var(--linha); }
  table.mes .n { text-align:right; white-space:nowrap; }
  .zoom { position:fixed; inset:0; background:#000d; z-index:20; display:flex; align-items:center; justify-content:center; padding:10px; }
  .zoom img { max-width:100%; max-height:100%; }
</style>
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Saídas do caixa</h1><a href="turno.html">Voltar</a></header>
<main>
  <div class="abas" id="abas" hidden>
    <button aria-pressed="true" data-aba="dia">Dia</button>
    <button aria-pressed="false" data-aba="mes">Resumo do mês</button>
  </div>
  <section id="aba-dia" style="display:flex;flex-direction:column;gap:10px">
    <div class="cartao">
      <div class="campo" style="margin:0">Dia <input type="date" id="dia"></div>
      <p id="resumo" style="margin:8px 0 0"></p>
    </div>
    <button class="botao principal" id="novo">+ Registrar saída ou entrada</button>
    <div id="lista" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <section id="aba-mes" hidden>
    <div class="cartao">
      <div class="campo" style="margin:0">Mês <input type="month" id="mes"></div>
      <div id="tabela" style="margin-top:8px"></div>
    </div>
  </section>
</main>
<div class="fundo-folha" id="fundo" hidden><div class="folha" id="folha"></div></div>
<div class="zoom" id="zoom" hidden><img alt="Foto"></div>

<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, hoje, dataBR } from "./js/sessao.js";
import { pode, EQUIPE_DO_TURNO } from "./js/equipe.js";
import { acrescentar, listar, ler } from "./js/db.js";

const eu = await exigirUsuario();
if (!pode.verCaixa(eu)) location.href = "turno.html";     // caixa, balcão, líderes, Daiane e Fábio
const lanca = pode.lancarCaixa(eu);                         // o Fábio só vê
const podeCancelar = pode.registrarNoLivro(eu);             // dona e líderes
const veMes = pode.verPainel(eu);

// Tudo o que mexe no dinheiro do caixa fora das vendas. foto: comprovante obrigatório.
const TIPOS = {
  sangria:    { nome: "Sangria", desc: "Dinheiro retirado do caixa e entregue", sinal: -1, campo: "Entregue para", opcoes: ["Daiane", "Fábio", "Cofre"] },
  vale:       { nome: "Vale de funcionário", desc: "Adiantamento para alguém da equipe", sinal: -1, campo: "Funcionário", pessoas: true },
  feriado:    { nome: "Pagamento de feriado", desc: "Feriado pago em mãos a alguém da equipe", sinal: -1, campo: "Funcionário", pessoas: true, exigeAut: true },
  diarista:   { nome: "Diarista / ajudante", desc: "Pagamento de quem não é fixo", sinal: -1, campo: "Nome de quem recebeu", texto: true, servico: true },
  compra:     { nome: "Compra", desc: "Algo comprado com dinheiro do caixa", sinal: -1, campo: "O que comprou e onde", texto: true, foto: true, exigeAut: true },
  fornecedor: { nome: "Pagamento de fornecedor", desc: "Farinha, ovos, queijo, salgados, gás...", sinal: -1, campo: "Fornecedor", opcoes: ["Farinha", "Ovos", "Queijo Priori", "Salgados", "Gás", "Outro"], foto: true, exigeAut: true },
  reforco:    { nome: "Reforço de troco", desc: "Dinheiro que entrou no caixa (não é venda)", sinal: 1, campo: "Quem trouxe", opcoes: ["Daiane", "Fábio", "Cofre"] },
  outro:      { nome: "Outra saída", desc: "Qualquer outra coisa (explique)", sinal: -1, campo: "O que foi", texto: true },
};
const AUTORIZOU = ["Daiane", "Fábio", "Ninguém"];
const LIMITE_SANGRIA = 600; // Daiane, 07/11/2026: no máximo R$ 600 saem do caixa físico em sangrias, SOMADO NO DIA.
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const reais = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const agora = () => new Date().toTimeString().slice(0, 5);
const turnoAgora = () => (new Date().getHours() < 14 ? "Manhã" : "Tarde");
const numero = (t) => { t = String(t).trim(); return Number(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t); }; // "1.234,50", "23,50" ou "23.50"
const semAut = (r) => TIPOS[r.tipoMov].sinal < 0 && r.autorizadoPor === "Ninguém";
const campoDia = document.getElementById("dia");
const sangriasHoje = async () => montar(await listar("caixa", "data", hoje())).filter((r) => r.tipoMov === "sangria" && !r.cancelamento).reduce((s, r) => s + r.valor, 0);
campoDia.value = hoje();

function reduzir(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      let lado = 1400, qualidade = 0.7, url;
      do {
        const escala = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL("image/jpeg", qualidade);
        lado -= 200; qualidade -= 0.05;
      } while (url.length > 500000 && lado > 400);
      URL.revokeObjectURL(img.src);
      ok(url);
    };
    img.onerror = falha;
    img.src = URL.createObjectURL(arquivo);
  });
}
let cacheDiarias;
const diarias = async () => (cacheDiarias ??= (await ler("diarias", "atual").catch(() => null)) || { valores: {}, formas: {} });
const cache = {};
const foto = (id) => (cache[id] ??= ler("caixa_fotos", id).then((d) => d?.foto || ""));
document.getElementById("zoom").onclick = (e) => { e.currentTarget.hidden = true; };

function montar(regs) {
  const canc = Object.fromEntries(regs.filter((r) => r.tipo === "cancelamento").map((r) => [r.refId, r]));
  return regs.filter((r) => r.tipo === "movimento").map((r) => ({ ...r, cancelamento: canc[r.id] })).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
}

async function mostrar() {
  const d = campoDia.value;
  const itens = montar(await listar("caixa", "data", d));
  const ok = itens.filter((r) => !r.cancelamento);
  const saidas = ok.filter((r) => TIPOS[r.tipoMov].sinal < 0).reduce((s, r) => s + r.valor, 0);
  const entradas = ok.filter((r) => TIPOS[r.tipoMov].sinal > 0).reduce((s, r) => s + r.valor, 0);
  const nSem = ok.filter(semAut).length;
  document.getElementById("resumo").innerHTML = `<b>${dataBR(d)}</b> · saíram <b>${reais(saidas)}</b>${entradas ? ` · entraram ${reais(entradas)}` : ""}`
    + (nSem ? `<br><span class="selo alerta" style="margin-left:0">${nSem} saída(s) sem autorização</span>` : "");
  document.getElementById("novo").hidden = !lanca || d !== hoje();
  const lista = document.getElementById("lista");
  lista.innerHTML = itens.length ? "" : `<p class="suave">Nada registrado neste dia.</p>`;
  for (const r of itens) {
    const t = TIPOS[r.tipoMov];
    const div = document.createElement("div");
    div.className = "mov" + (r.cancelamento ? " cancelada" : "");
    div.innerHTML = `${r.fotoId ? `<img data-foto="${esc(r.fotoId)}" alt="Comprovante">` : ""}
      <div class="info"><span class="prod">${t.sinal > 0 ? "+" : "−"} ${reais(r.valor)} · ${esc(t.nome)}</span>
        <span>${esc(t.campo)}: <b>${esc(r.para)}</b>${r.servico ? ` · ${esc(r.servico)}` : ""}</span>
        ${r.diaria != null ? `<span class="suave">${r.qtdDiarias === 2 ? "2 diárias" : "Diária"} ${reais(r.diaria)} + passagem ${reais(r.passagem)}</span>` : ""}
        ${t.sinal < 0 ? `<span><span class="selo ${r.autorizadoPor === "Ninguém" ? "alerta" : "ok"}" style="margin-left:0">${r.autorizadoPor === "Ninguém" ? "sem autorização" : `autorizado por ${esc(r.autorizadoPor)}`}</span></span>` : ""}
        ${r.obs ? `<span class="suave">${esc(r.obs)}</span>` : ""}
        <span class="suave">${esc(r.turno)} · ${esc(r.registradoPor)} às ${esc(r.hora)}</span>
        ${r.cancelamento ? `<span class="suave">Cancelado por ${esc(r.cancelamento.registradoPor)}: ${esc(r.cancelamento.motivo)}</span>` : ""}
      </div>`;
    if (!r.cancelamento && podeCancelar && d === hoje()) {
      const b = document.createElement("button"); b.textContent = "Cancelar";
      b.onclick = async () => {
        const m = prompt("Por que cancelar este registro?"); if (!m?.trim()) return;
        await acrescentar("caixa", { tipo: "cancelamento", refId: r.id, motivo: m.trim(), data: r.data, mes: r.mes, hora: agora(),
          registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() }).catch(() => alert("Não consegui salvar."));
        mostrar();
      };
      div.querySelector(".info").append(b);
    }
    lista.append(div);
  }
  lista.querySelectorAll("img[data-foto]").forEach(async (img) => {
    img.src = await foto(img.dataset.foto);
    img.onclick = () => { const z = document.getElementById("zoom"); z.querySelector("img").src = img.src; z.hidden = false; };
  });
}

/* ---------- Registrar ---------- */
const fundo = document.getElementById("fundo");
const folha = document.getElementById("folha");
fundo.onclick = (e) => { if (e.target === fundo) fundo.hidden = true; };

function abrir() {
  folha.innerHTML = `<h2>O que aconteceu?</h2><div class="opcoes" style="grid-template-columns:1fr">${Object.entries(TIPOS).map(([k, t]) =>
    `<button type="button" data-v="${k}" style="text-align:left"><b>${t.nome}</b><br><span class="suave">${t.desc}</span></button>`).join("")}</div>
    <button class="botao" id="f-x" style="text-align:center;border:none">Cancelar</button>`;
  folha.querySelector(".opcoes").onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (v) formulario(v); };
  folha.querySelector("#f-x").onclick = () => { fundo.hidden = true; };
  fundo.hidden = false;
}

function formulario(tipoMov) {
  const t = TIPOS[tipoMov];
  const sel = { para: null, autorizadoPor: null };
  let urlFoto = null;
  const grupo = (id, lista, cls = "") => `<div class="opcoes ${cls}" id="${id}">${lista.map((x) => `<button type="button" data-v="${esc(x)}" aria-pressed="false">${esc(x)}</button>`).join("")}</div>`;
  const campoPara = t.pessoas ? `<select id="f-para" style="font-size:17px;padding:10px;border:1px solid var(--linha);border-radius:10px;background:#fff"><option value="">Escolha a pessoa</option>${EQUIPE_DO_TURNO.map((p) => `<option>${esc(p.nome)}</option>`).join("")}</select>`
    : t.opcoes ? grupo("f-para-op", t.opcoes, t.opcoes.length === 3 ? "tres" : "") : `<input type="text" id="f-para" autocomplete="off">`;
  folha.innerHTML = `<h2>${t.sinal > 0 ? "Entrada" : "Saída"}: ${esc(t.nome)}</h2>
    <label class="rot" for="f-valor">${tipoMov === "feriado" ? "Diária(s) (R$)" : "Valor (R$)"}</label><input id="f-valor" inputmode="decimal" placeholder="0,00">
    ${tipoMov === "feriado" ? `<label class="rot" for="f-pass">Passagem (R$)</label><input id="f-pass" inputmode="decimal" placeholder="Valor da passagem desta pessoa (0 se não tem)"><p id="f-total" style="margin:0;font-size:16px;font-weight:700"></p>` : ""}
    ${tipoMov === "sangria" ? `<p id="f-sang" style="margin:0;font-size:15px"></p><p class="suave" style="margin:0;font-size:13px">Máximo de ${reais(LIMITE_SANGRIA)} em sangrias no dia todo (somando todas). Pagamento de feriado não é sangria: registre em "Pagamento de feriado", um por pessoa.</p>` : tipoMov === "feriado" ? `<p class="suave" style="margin:0;font-size:13px">Um registro para cada pessoa. Escolha a pessoa abaixo e a diária aparece sozinha.</p>` : ""}
    <label class="rot">${esc(t.campo)}</label>${campoPara}
    ${tipoMov === "feriado" ? `<p id="f-diaria" style="margin:0;font-size:15px"></p>` : ""}
    ${t.servico ? `<label class="rot" for="f-serv">Que serviço fez</label><input type="text" id="f-serv" autocomplete="off" placeholder="Ex.: ajudou na produção das 6h às 12h">` : ""}
    ${t.sinal < 0 ? `<label class="rot">Quem autorizou</label>${t.exigeAut ? grupo("f-aut", ["Daiane", "Fábio"]) + `<p class="suave" style="margin:0;font-size:13px">${tipoMov === "feriado" ? "Só paga com autorização da Daiane ou do Fábio." : "Não existe compra sem autorização. Sem a Daiane ou o Fábio autorizar, não compre."}</p>` : grupo("f-aut", AUTORIZOU, "tres")}` : ""}
    ${t.foto ? `<label class="camera" id="f-cam">📷 <span>Foto do comprovante ou nota (obrigatória)</span><input type="file" accept="image/*" capture="environment"></label>` : ""}
    <input type="text" id="f-obs" placeholder="${tipoMov === "outro" ? "Explique (obrigatório)" : "Observação (opcional)"}" autocomplete="off">
    <p class="msg-erro" id="f-erro"></p>
    <button class="botao principal" id="f-ok">Salvar</button>
    <button class="botao" id="f-x" style="text-align:center;border:none">Voltar</button>`;
  const liga = (id, chave) => { const g = folha.querySelector(id); if (!g) return;
    g.onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; sel[chave] = v; g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v)); }; };
  liga("#f-para-op", "para"); liga("#f-aut", "autorizadoPor");
  // Feriado: diária (do RH) + passagem (cada um tem um valor), e mostra o total a pagar.
  const total = () => { const tt = folha.querySelector("#f-total"); if (!tt) return; const d = numero(folha.querySelector("#f-valor").value) || 0, pa = numero(folha.querySelector("#f-pass").value) || 0; tt.textContent = d ? `Total a pagar: ${reais(d + pa)}` : ""; };
  if (tipoMov === "feriado") { folha.querySelector("#f-valor").oninput = total; folha.querySelector("#f-pass").oninput = total; }
  if (tipoMov === "feriado") folha.querySelector("#f-para").onchange = async (e) => {
    const dd = await diarias(), v = dd.valores?.[e.target.value], forma = dd.formas?.[e.target.value];
    const qtd = forma === "maos" ? 2 : 1;
    folha.dataset.diaria = v || ""; folha.dataset.qtd = qtd;
    const dica = folha.querySelector("#f-diaria");
    if (v) { folha.querySelector("#f-valor").value = (v * qtd).toFixed(2).replace(".", ",");
      dica.innerHTML = `${esc(e.target.value)} recebe ${forma === "maos" ? "em mãos: <b>2 diárias</b>" : "pela conta: <b>1 diária</b>"} de ${reais(v)} = <b>${reais(v * qtd)}</b>. Some a passagem abaixo.`; total(); }
    else dica.textContent = e.target.value ? "A Daiane ainda não cadastrou a diária desta pessoa. Pergunte a ela o valor." : "";
  };
  const cam = folha.querySelector("#f-cam");
  if (cam) cam.querySelector("input").onchange = async function trocar(e) {
    const a = e.target.files[0]; if (!a) return;
    cam.querySelector("span").textContent = "Preparando a foto…";
    try { urlFoto = await reduzir(a); cam.innerHTML = `<img src="${urlFoto}" alt="Foto"><span>Foto pronta. Toque para trocar.</span><input type="file" accept="image/*" capture="environment">`; cam.querySelector("input").onchange = trocar; }
    catch { cam.querySelector("span").textContent = "Não consegui ler a foto. Tente de novo."; }
  };
  folha.querySelector("#f-x").onclick = abrir;
  folha.querySelector("#f-ok").onclick = async (e) => {
    const erro = folha.querySelector("#f-erro");
    const valor = numero(folha.querySelector("#f-valor").value);
    const para = sel.para || folha.querySelector("#f-para")?.value.trim();
    const servico = folha.querySelector("#f-serv")?.value.trim();
    const obs = folha.querySelector("#f-obs").value.trim();
    if (!(valor > 0)) return (erro.textContent = tipoMov === "feriado" ? "Coloque a diária." : "Coloque o valor.");
    const passagem = tipoMov === "feriado" ? numero(folha.querySelector("#f-pass").value) : null;
    if (tipoMov === "feriado" && (folha.querySelector("#f-pass").value.trim() === "" || !(passagem >= 0))) return (erro.textContent = "Coloque a passagem (0 se a pessoa não tem).");
    if (tipoMov === "sangria") {
      let ja; try { ja = await sangriasHoje(); } catch { return (erro.textContent = "Não consegui ver as sangrias de hoje. Verifique a internet."); }
      if (ja + valor > LIMITE_SANGRIA + 0.001) return (erro.textContent = `Hoje já saíram ${reais(ja)} em sangria. O máximo do dia é ${reais(LIMITE_SANGRIA)}, então agora só pode sair ${reais(Math.max(0, LIMITE_SANGRIA - ja))}.`);
    }
    if (!para) return (erro.textContent = `Preencha: ${t.campo.toLowerCase()}.`);
    if (t.servico && !servico) return (erro.textContent = "Escreva que serviço a pessoa fez.");
    if (t.sinal < 0 && !sel.autorizadoPor) return (erro.textContent = t.exigeAut ? "Marque quem autorizou. Sem autorização, não pode comprar." : "Marque quem autorizou (ou Ninguém).");
    if (t.foto && !urlFoto) return (erro.textContent = "Tire a foto do comprovante.");
    if (tipoMov === "outro" && !obs) return (erro.textContent = "Explique o que foi.");
    e.target.disabled = true;
    try {
      const d = hoje();
      const base = { data: d, mes: d.slice(0, 7), hora: agora(), registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() };
      const fotoId = urlFoto ? await acrescentar("caixa_fotos", { ...base, foto: urlFoto }) : null;
      if (fotoId) cache[fotoId] = Promise.resolve(urlFoto);
      const totalPago = tipoMov === "feriado" ? valor + passagem : valor;
      await acrescentar("caixa", { ...base, tipo: "movimento", tipoMov, valor: Math.round(totalPago * 100) / 100, para,
        diaria: tipoMov === "feriado" ? Math.round(valor * 100) / 100 : null, qtdDiarias: tipoMov === "feriado" ? Number(folha.dataset.qtd || 1) : null, passagem: tipoMov === "feriado" ? Math.round(passagem * 100) / 100 : null, servico: servico || null,
        autorizadoPor: t.sinal < 0 ? sel.autorizadoPor : null, turno: turnoAgora(), obs, fotoId });
      fundo.hidden = true; campoDia.value = d; mostrar();
    } catch { erro.textContent = "Não consegui salvar. Verifique a internet e tente de novo."; e.target.disabled = false; }
  };
  if (tipoMov === "sangria") sangriasHoje().then((ja) => { const el = folha.querySelector("#f-sang"); if (el) el.innerHTML = `Já saiu hoje: <b>${reais(ja)}</b>. Ainda pode sair: <b>${reais(Math.max(0, LIMITE_SANGRIA - ja))}</b>.`; }).catch(() => {});
  folha.querySelector("#f-valor").focus();
}
document.getElementById("novo").onclick = abrir;
campoDia.onchange = mostrar;

/* ---------- Resumo do mês (Daiane e Fábio) ---------- */
const campoMes = document.getElementById("mes");
campoMes.value = hoje().slice(0, 7);
async function mostrarMes() {
  const itens = montar(await listar("caixa", "mes", campoMes.value)).filter((r) => !r.cancelamento);
  if (!itens.length) { document.getElementById("tabela").innerHTML = `<p class="suave">Nada registrado neste mês.</p>`; return; }
  const soma = (l) => l.reduce((s, r) => s + r.valor, 0);
  const porTipo = Object.entries(TIPOS).map(([k, t]) => [t.nome, itens.filter((r) => r.tipoMov === k)]).filter(([, l]) => l.length);
  const agrupa = (tipo) => { const g = {}; for (const r of itens.filter((r) => r.tipoMov === tipo)) g[r.para] = (g[r.para] || 0) + r.valor; return Object.entries(g).sort((a, b) => b[1] - a[1]); };
  const tabela = (titulo, linhas) => linhas.length ? `<h3 style="margin:14px 0 4px;font-size:15px">${titulo}</h3><table class="mes">${linhas.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="n">${reais(v)}</td></tr>`).join("")}</table>` : "";
  const sem = itens.filter(semAut);
  document.getElementById("tabela").innerHTML =
    tabela("Por tipo", porTipo.map(([n, l]) => [`${n} (${l.length}x)`, soma(l)]))
    + tabela("Vales por funcionário (para descontar)", agrupa("vale"))
    + tabela("Feriados pagos em mãos", agrupa("feriado"))
    + tabela("Diaristas e ajudantes", agrupa("diarista"))
    + tabela("Fornecedores pagos pelo caixa", agrupa("fornecedor"))
    + (sem.length ? `<h3 style="margin:14px 0 4px;font-size:15px;color:var(--alerta)">Saídas sem autorização: ${reais(soma(sem))}</h3><table class="mes">${sem.map((r) => `<tr><td>${dataBR(r.data).slice(0, 5)} · ${esc(TIPOS[r.tipoMov].nome)}: ${esc(r.para)} <span class="suave">(${esc(r.registradoPor)})</span></td><td class="n">${reais(r.valor)}</td></tr>`).join("")}</table>` : "");
}
campoMes.onchange = mostrarMes;
if (veMes) {
  const abas = document.getElementById("abas");
  abas.hidden = false;
  abas.onclick = (e) => {
    const aba = e.target.closest("button")?.dataset.aba; if (!aba) return;
    abas.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.aba === aba));
    document.getElementById("aba-dia").hidden = aba !== "dia";
    document.getElementById("aba-mes").hidden = aba !== "mes";
    if (aba === "mes") mostrarMes();
  };
}
mostrar();
</script>
