<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Painel da Daiane</h1><a href="turno.html">Voltar</a></header>
<main>
  <div class="cartao campo" style="margin:0">Dia <input type="date" id="dia"></div>
  <div id="resumo" style="display:flex;flex-direction:column;gap:10px"></div>
</main>
<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, hoje } from "./js/sessao.js";
import { EQUIPE_DO_TURNO, pode } from "./js/equipe.js";
import { listar, listarEntre, ler } from "./js/db.js";
import { CHECKLISTS } from "./js/checklists.js";
import { distribuir } from "./js/rodizio.js";
import { chaveProduto } from "./js/produtos.js";
import { INSUMOS_PADRAO, LOCAIS } from "./js/insumos.js";
import { TAREFAS_COZINHA, COZINHAS } from "./js/cozinha.js";
import { folgasNoDia, segundaDe, somarDias } from "./js/escala.js";

if (!pode.verPainel(await exigirUsuario())) location.href = "turno.html";
const campoDia = document.getElementById("dia");
campoDia.value = hoje();

function bloco(titulo, itens, tipo) {
  const corpo = itens.length ? `<ul class="lista">${itens.map((i) => `<li>${i}</li>`).join("")}</ul>`
                             : `<p class="suave">Nada aqui.</p>`;
  return `<div class="cartao"><h2>${titulo} <span class="selo ${itens.length ? tipo : "ok"}">${itens.length}</span></h2>${corpo}</div>`;
}

async function mostrar() {
  const registros = await listar("presenca", "data", campoDia.value);
  const livro = await listar("livro", "data", campoDia.value);
  // Encomendas do dia escolhido e do dia seguinte.
  const [a0, m0, d0] = campoDia.value.split("-").map(Number);
  const dx = new Date(a0, m0 - 1, d0 + 1);
  const diaSeguinte = `${dx.getFullYear()}-${String(dx.getMonth() + 1).padStart(2, "0")}-${String(dx.getDate()).padStart(2, "0")}`;
  const encBruto = await listarEntre("encomendas", "dataEntrega", campoDia.value, diaSeguinte);
  const encs = encBruto.filter((r) => r.tipo === "encomenda").map((e) => {
    const ev = encBruto.filter((r) => r.refId === e.id).sort((x, y) => (x.criadoEm || "").localeCompare(y.criadoEm || ""));
    return { ...e, status: ev.filter((r) => r.tipo === "status").at(-1)?.para || "anotada", conf: ev.filter((r) => r.tipo === "conferida").map((r) => r.momento) };
  }).filter((e) => e.status !== "cancelada");
  const ETAPA = { anotada: "anotada", producao: "em produção", pronta: "pronta", entregue: "entregue" };
  const encDia = encs.filter((e) => e.dataEntrega === campoDia.value).sort((x, y) => (x.horaEntrega || "").localeCompare(y.horaEntrega || ""))
    .map((e) => `${e.horaEntrega} · ${e.cliente}: ${e.pedido} <span class="suave">(${ETAPA[e.status]}${e.status !== "entregue" && !e.conf.includes("abertura") ? ", <b>sem conferir na abertura</b>" : ""})</span>`);
  const encAmanha = encs.filter((e) => e.dataEntrega === diaSeguinte)
    .map((e) => `${e.horaEntrega} · ${e.cliente}: ${e.pedido}${e.conf.includes("vespera") ? "" : ' <span class="suave">(<b>sem conferir na véspera</b>)</span>'}`);
  const viram = Object.values(Object.fromEntries(encBruto.filter((r) => r.tipo === "visto" && r.dataEntrega === campoDia.value)
    .sort((x, y) => x.criadoEm.localeCompare(y.criadoEm)).map((r) => [r.registradoPor, r]))).map((r) => `${r.registradoPor} às ${r.hora}`);
  const notasBruto = await listar("notas", "data", campoDia.value);
  const notaUlt = (id, t) => notasBruto.filter((r) => r.refId === id && r.tipo === t).sort((x, y) => x.criadoEm.localeCompare(y.criadoEm)).at(-1);
  const notas = notasBruto.filter((r) => r.tipo === "nota" && !notaUlt(r.id, "cancelado")).map((r) => ({ ...r, conf: notaUlt(r.id, "conferido") }));
  const notasAtencao = notas.filter((n) => !n.conf || !n.conf.ok)
    .map((n) => `${n.empresa}: ${n.conf ? `<b>problema</b> (${n.conf.detalhe || ({ sem_via: "faltou a via na pasta", sem_assinatura: "via sem assinatura", fora_guappo: "não está no Guappo" })[n.conf.problema] || n.conf.problema})` : "foto enviada, falta conferir"}`);
  const plano = await distribuir(campoDia.value);
  const tarefasRegs = await listar("tarefas", "data", campoDia.value);
  const tFeita = (t) => t.fotos === "uma" ? tarefasRegs.some((r) => r.tarefa === t.id && r.tipo === "depois") : t.fotos ? ["antes", "depois"].every((k) => tarefasRegs.some((r) => r.tarefa === t.id && r.tipo === k)) : tarefasRegs.some((r) => r.tarefa === t.id && r.tipo === "feito");
  const tarefasAbertas = plano.filter((p) => !tFeita(p.tarefa)).map((p) => `${p.pessoa || "ninguém"}: ${p.tarefa.texto}`);
  const tarefasFeitas = plano.filter((p) => tFeita(p.tarefa)).map((p) => `${p.pessoa}: ${p.tarefa.texto}`);
  const cks = await listar("checklists", "data", campoDia.value);
  const ckFeitos = [], ckPendentes = [];
  for (const l of CHECKLISTS) {
    const meus = cks.filter((c) => c.lista === l.id);
    if (l.repetivel) { (meus.length ? ckFeitos : ckPendentes).push(`${l.titulo}: ${meus.length} ronda(s)`); continue; }
    for (const t of l.porTurno ? ["Manhã", "Tarde"] : [null]) {
      const f = meus.find((c) => !t || c.turno === t);
      const nome = `${l.titulo}${t ? ` (${t})` : ""}`;
      if (f) ckFeitos.push(`${nome}: ${f.registradoPor} às ${f.hora}`); else ckPendentes.push(nome);
    }
  }
  const ckProblemas = cks.flatMap((c) => c.respostas.filter((r) => !r.ok).map((r) =>
    `${c.titulo}${c.turno ? ` (${c.turno})` : ""}: ${r.texto}${r.valor != null ? ` = ${r.valor}` : ""} <span class="suave">(${r.obs}; ${c.registradoPor})</span>`));
  const perdasBruto = await listar("perdas", "data", campoDia.value);
  const perdasCanc = new Set(perdasBruto.filter((r) => r.tipo === "cancelamento").map((r) => r.refId));
  const perdas = perdasBruto.filter((r) => r.tipo === "perda" && !perdasCanc.has(r.id));
  const perdasLixo = perdas.filter((r) => r.destino === "lixo").map((r) => `${r.produto}: ${String(r.quantidade).replace(".", ",")} ${r.unidade} <span class="suave">(${r.setor}, ${r.registradoPor})</span>`);
  const prodBruto = await listar("producao", "data", campoDia.value);
  const prodCanc = new Set(prodBruto.filter((r) => r.tipo === "cancelamento").map((r) => r.refId));
  const prod = prodBruto.filter((r) => r.tipo === "producao" && !prodCanc.has(r.id));
  const feitoPor = {};
  for (const r of prod) feitoPor[chaveProduto(r.produto, r.unidade)] = (feitoPor[chaveProduto(r.produto, r.unidade)] || 0) + (Number(r.quantidade) || 0);
  const perdidoPor = {}, nomeDe = {};
  for (const r of perdas) { const k = chaveProduto(r.produto, r.unidade); nomeDe[k] = `${r.produto} (${r.unidade})`; perdidoPor[k] = (perdidoPor[k] || 0) + (Number(r.quantidade) || 0); }
  const muitaPerda = Object.entries(perdidoPor).filter(([k, v]) => feitoPor[k] && v / feitoPor[k] >= 0.1)
    .map(([k, v]) => { return `${nomeDe[k]}: ${Math.round((v / feitoPor[k]) * 100)}% perdido <span class="suave">(${v} de ${feitoPor[k]})</span>`; });
  const segCoz = segundaDe(campoDia.value);
  const coz = (await listarEntre("cozinha", "data", segCoz, somarDias(segCoz, 6))).filter((r) => r.data <= campoDia.value);
  const cozFeita = (t, onde) => { const m = coz.filter((r) => r.tarefa === t.id && r.onde === onde && (t.freq === "semanal" || r.data === campoDia.value));
    return t.fotos === "antes_depois" ? m.some((r) => r.tipo === "antes") && m.some((r) => r.tipo === "depois") : m.some((r) => r.tipo === "depois" || r.tipo === "feito"); };
  const cozAbertas = COZINHAS.flatMap((o) => TAREFAS_COZINHA.filter((t) => !cozFeita(t, o)).map((t) => `${o}: ${t.texto}${t.freq === "semanal" ? ' <span class="suave">(semanal)</span>' : ""}`));
  const cozQuem = [...new Set(coz.filter((r) => r.data === campoDia.value && r.tipo !== "antes").map((r) => r.registradoPor))];
  const fichasRegs = (await listarEntre("fichas", "data", "2000-01-01", "9999-12-31")).sort((x, y) => x.criadoEm.localeCompare(y.criadoEm));
  const fichaAtual = {};
  for (const r of fichasRegs.filter((r) => r.tipo === "ficha")) fichaAtual[r.produto] = r;
  const fichasEsperando = Object.values(fichaAtual).filter((f) => !fichasRegs.some((r) => r.refId === f.id)).map((f) => `${f.produto} <span class="suave">(${f.registradoPor})</span>`);
  const fichasAprovadas = Object.values(fichaAtual).filter((f) => fichasRegs.filter((r) => r.refId === f.id).at(-1)?.tipo === "aprovacao").length;
  const cxBruto = await listar("caixa", "data", campoDia.value);
  const cxCanc = new Set(cxBruto.filter((r) => r.tipo === "cancelamento").map((r) => r.refId));
  const cx = cxBruto.filter((r) => r.tipo === "movimento" && !cxCanc.has(r.id));
  const CX = { sangria: "Sangria", vale: "Vale", feriado: "Feriado pago", diarista: "Diarista", compra: "Compra", fornecedor: "Fornecedor", reforco: "Reforço de troco", outro: "Outra saída" };
  const cxSem = cx.filter((r) => r.tipoMov !== "reforco" && r.autorizadoPor === "Ninguém")
    .map((r) => `${CX[r.tipoMov]}: ${r.para} · ${(r.valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })} <span class="suave">(${r.registradoPor} às ${r.hora})</span>`);
  const cxSaiu = cx.filter((r) => r.tipoMov !== "reforco").reduce((s2, r) => s2 + r.valor, 0);
  // Estoque: saldo (última contagem + movimentos), abaixo do mínimo, sumiço na contagem e compras do dia.
  const insCad = (await ler("estoque_cadastro", "insumos").catch(() => null))?.lista || INSUMOS_PADRAO;
  const estRegs = (await listarEntre("estoque", "data", "2000-01-01", campoDia.value)).sort((x, y) => x.criadoEm.localeCompare(y.criadoEm));
  const estCanc = new Set(estRegs.filter((r) => r.tipo === "cancelamento").map((r) => r.refId));
  const est = estRegs.filter((r) => r.tipo === "mov" && !estCanc.has(r.id));
  const sd = {};
  for (const m of est) {
    const k = (l) => `${m.insumoId}|${l}`;
    if (m.acao === "contagem") sd[k(m.local)] = m.qtd;
    else if (m.acao === "transferencia") { sd[k(m.de)] = (sd[k(m.de)] || 0) - m.qtd; sd[k(m.para)] = (sd[k(m.para)] || 0) + m.qtd; }
    else sd[k(m.local)] = (sd[k(m.local)] || 0) + (m.acao === "entrada" ? 1 : -1) * m.qtd;
  }
  const temContagem = est.some((m) => m.acao === "contagem");
  const contadosEst = new Set(est.filter((m) => m.acao === "contagem").map((m) => m.insumoId));
  const estBaixo = temContagem ? insCad.filter((i) => contadosEst.has(i.id) && i.minimo > 0 && LOCAIS.reduce((t, l) => t + (sd[`${i.id}|${l}`] || 0), 0) < i.minimo)
    .map((i) => `${i.nome}: ${String(Math.round(LOCAIS.reduce((t, l) => t + (sd[`${i.id}|${l}`] || 0), 0) * 100) / 100).replace(".", ",")} ${i.unidade} <span class="suave">(mínimo ${i.minimo})</span>`) : [];
  const estDif = est.filter((m) => m.acao === "contagem" && m.data === campoDia.value && m.diferenca < 0).map((m) => `${m.nome} (${m.local}): faltou ${String(-m.diferenca).replace(".", ",")} ${m.unidade} <span class="suave">(contado por ${m.registradoPor})</span>`);
  const estCompras = est.filter((m) => m.acao === "entrada" && m.data === campoDia.value);
  // Empresas: pedido sem separar hoje, nota sem valor hoje, cobranças atrasadas (últimos 6 meses).
  const pedHoje = notasBruto.filter((r) => r.tipo === "pedido" && !notaUlt(r.id, "cancelado"));
  const pedSemSep = pedHoje.filter((r) => !notaUlt(r.id, "separado")).map((r) => `${r.empresa}: ${r.texto.slice(0, 60)}${r.texto.length > 60 ? "…" : ""}`);
  const pedSemNota = pedHoje.filter((r) => !notas.some((n) => n.empresa === r.empresa)).map((r) => `${r.empresa} <span class="suave">(pedido anotado, sem nota assinada)</span>`);
  const notaSemValor = notas.filter((n) => n.valor == null).map((n) => `${n.empresa} <span class="suave">(foto às ${n.hora})</span>`);
  const mes6 = new Date(campoDia.value); mes6.setMonth(mes6.getMonth() - 6);
  const cobs = await listarEntre("cobrancas", "mes", mes6.toISOString().slice(0, 7), campoDia.value.slice(0, 7)).catch(() => []);
  const cobCanc = new Set(cobs.filter((c) => c.tipo === "cancelamento").map((c) => c.refId));
  const cobOk = cobs.filter((c) => !cobCanc.has(c.id)).sort((x, y) => x.criadoEm.localeCompare(y.criadoEm));
  const ultCob = {};
  for (const c of cobOk.filter((c) => c.tipo === "cobranca")) ultCob[`${c.empresa}|${c.mes}`] = c;
  const atrasadas = Object.values(ultCob).map((c) => ({ c, pago: cobOk.filter((p) => p.tipo === "pagamento" && p.empresa === c.empresa && p.mes === c.mes).reduce((t, p) => t + p.valor, 0) }))
    .filter(({ c, pago }) => c.total - pago > 0.009 && campoDia.value > c.vencimento)
    .map(({ c, pago }) => `${c.empresa} (${c.mes.split("-").reverse().join("/")}): falta ${(c.total - pago).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })} <span class="suave">· venceu ${c.vencimento.split("-").reverse().join("/")}</span>`);
  const consumoBruto = await listar("consumo", "data", campoDia.value);
  const cancelados = new Set(consumoBruto.filter((r) => r.tipo === "cancelamento").map((r) => r.refId));
  const consumo = consumoBruto.filter((r) => r.tipo === "consumo" && !cancelados.has(r.id));
  const reais = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const pagou = (r) => r.pagamento === "dinheiro" || r.pagamento === "pix";
  const autorizado = (r) => r.autorizadoPor && r.autorizadoPor !== "Ninguém";
  const consumoSemAut = consumo.filter((r) => !pagou(r) && !autorizado(r))
    .map((r) => `${r.pessoa}: ${r.itens} · ${reais(r.valor)} <span class="suave">(${r.pagamento === "descontar" ? "descontar" : "não pagou"}, lançado por ${r.registradoPor})</span>`);
  const consumoTotal = consumo.reduce((s, r) => s + (Number(r.valor) || 0), 0);
  const ligado = (tipo, id) => livro.some((r) => r.tipo === tipo && r.refId === id);
  const urgentes = livro.filter((r) => r.tipo === "ocorrencia" && r.urgente).map((r) => `${r.hora} · ${r.fato} <span class="suave">(${r.autor})</span>`);
  const ocorr = livro.filter((r) => r.tipo === "ocorrencia" && !r.urgente).map((r) => `${r.codigo} · ${r.fato}`);
  const ordensAbertas = livro.filter((r) => r.tipo === "ordem" && !ligado("feito", r.id))
    .map((r) => `${r.texto} <span class="suave">(para ${r.para}${ligado("ciente", r.id) ? ", ciente" : ", ninguém ciente"})</span>`);
  const fechou = livro.some((r) => r.tipo === "fechamento"), visto = livro.some((r) => r.tipo === "visto");
  const por = Object.fromEntries(registros.map((r) => [r.pessoa, r]));
  const obs = (r) => (r.obs ? ` <span class="suave">(${r.obs})</span>` : "");
  const faltas = registros.filter((r) => r.situacao === "faltou" || r.situacao === "atestado")
    .map((r) => `${r.pessoa}: ${r.situacao}${obs(r)}`);
  const ROTULO = { chinelo: "calçado inadequado", sem_uniforme: "uniforme incompleto", sem_touca: "sem touca" };
  const apresentacao = registros.filter((r) => r.situacao === "veio" && r.problemas?.length)
    .map((r) => `${r.pessoa}: ${r.problemas.map((x) => ROTULO[x] || x).join(", ")}${obs(r)}`);
  const folgasEsc = await folgasNoDia(campoDia.value);
  const semMarcar = EQUIPE_DO_TURNO.filter((p) => !por[p.nome] && !folgasEsc.includes(p.nome)).map((p) => p.nome);
  const vieram = registros.filter((r) => r.situacao === "veio")
    .map((r) => `${r.pessoa}${r.chegada ? ` às ${r.chegada}` : ""} <span class="suave">· marcado por ${r.marcadoPor}</span>`);
  const folgas = registros.filter((r) => r.situacao === "folga").map((r) => r.pessoa);
  document.getElementById("resumo").innerHTML =
    bloco("Ocorrências urgentes", urgentes, "alerta") +
    bloco("Ordens ainda não feitas", ordensAbertas, "pendente") +
    `<div class="cartao"><h2>Livro do dia</h2><p class="suave">${fechou ? "Dia fechado" : "Dia ainda não fechado"} · ${visto ? "com seu visto" : "sem seu visto"} · ${ocorr.length} outra(s) ocorrência(s). <a href="livro.html">Abrir o livro</a></p></div>` +
    bloco("Tarefas do balcão não feitas", tarefasAbertas, "pendente") +
    `<div class="cartao"><h2>Rodízio do balcão</h2><p class="suave">${tarefasFeitas.length} de ${plano.length} feitas. <a href="tarefas.html">Ver fotos</a></p></div>` +
    bloco("Checklists com problema", ckProblemas, "alerta") +
    bloco("Checklists não feitos", ckPendentes, "pendente") +
    bloco("Checklists feitos", ckFeitos, "ok") +
    bloco("Empresas com pagamento atrasado", atrasadas, "alerta") +
    bloco("Pedidos das empresas sem separar", pedSemSep, "pendente") +
    bloco("Pedido sem nota assinada", pedSemNota, "alerta") +
    bloco("Nota de empresa sem valor", notaSemValor, "alerta") +
    bloco("Notas das empresas com pendência", notasAtencao, "alerta") +
    `<div class="cartao"><h2>Notas das empresas</h2><p class="suave">${new Set(notas.map((n) => n.empresa)).size} empresa(s) com nota · ${notas.filter((n) => n.conf?.ok).length} conferida(s) e certa(s). <a href="notas.html">Abrir</a></p></div>` +
    bloco("Encomendas do dia", encDia, "pendente") +
    (encDia.length ? `<div class="cartao"><h2>Quem viu as encomendas de hoje</h2><p class="suave">${viram.length ? viram.join(" · ") : "Ninguém marcou que viu ainda."}</p></div>` : "") +
    bloco("Encomendas do dia seguinte", encAmanha, "pendente") +
    bloco("Produtos com 10% ou mais de perda", muitaPerda, "alerta") +
    `<div class="cartao"><h2>Produção do dia</h2><p class="suave">${prod.length} registro(s) de produção${prod.length ? "" : " (ninguém registrou ainda)"}. <a href="producao-dia.html">Ver feito x perdido</a></p></div>` +
    bloco("Limpeza da cozinha não feita", cozAbertas, "pendente") +
    `<div class="cartao"><h2>Limpeza da cozinha</h2><p class="suave">${cozQuem.length ? `Hoje fizeram: ${cozQuem.join(", ")}` : "Ninguém registrou limpeza hoje"}. <a href="cozinha.html">Ver fotos</a></p></div>` +
    bloco("Fichas técnicas esperando sua aprovação", fichasEsperando, "pendente") +
    `<div class="cartao"><h2>Fichas técnicas</h2><p class="suave">${fichasAprovadas} aprovada(s). <a href="fichas.html">Abrir</a></p></div>` +
    bloco("Estoque abaixo do mínimo", estBaixo, "alerta") +
    bloco("Sumiu na contagem do estoque", estDif, "alerta") +
    `<div class="cartao"><h2>Estoque</h2><p class="suave">${temContagem ? "" : "Ainda não teve nenhuma contagem: peça para contarem tudo uma vez. "}${estCompras.length} compra(s) hoje · ${(estCompras.reduce((t, m) => t + m.qtd * m.preco, 0)).toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}. <a href="estoque.html">Abrir</a></p></div>` +
    bloco("Perdas que foram para o lixo", perdasLixo, "alerta") +
    `<div class="cartao"><h2>Perdas e sobras</h2><p class="suave">${perdas.length} registro(s) hoje · ${perdasLixo.length} para o lixo. <a href="perdas.html">Ver fotos e resumo do mês</a></p></div>` +
    bloco("Saídas do caixa sem autorização", cxSem, "alerta") +
    `<div class="cartao"><h2>Saídas do caixa</h2><p class="suave">${cx.length} registro(s) · saíram ${cxSaiu.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}. <a href="caixa.html">Ver tudo</a></p></div>` +
    bloco("Consumo sem pagamento e sem autorização", consumoSemAut, "alerta") +
    `<div class="cartao"><h2>Consumo da equipe</h2><p class="suave">${consumo.length} registro(s) · total ${reais(consumoTotal)}${cancelados.size ? ` · ${cancelados.size} cancelado(s)` : ""}. <a href="consumo.html">Ver tudo</a></p></div>` +
    bloco("Faltas", faltas, "alerta") +
    bloco("Apresentação fora do padrão", apresentacao, "alerta") +
    bloco("Presença não marcada", semMarcar, "pendente") +
    bloco("Vieram", vieram, "ok") +
    bloco("De folga", folgas, "ok") +
    bloco("Folga na escala (sem presença marcada)", folgasEsc.filter((n) => !por[n]), "ok");
}
campoDia.onchange = mostrar;
mostrar();
</script>
