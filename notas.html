<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Empresas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  [hidden] { display:none !important; }
  .abas { display:flex; gap:6px; }
  .abas button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--linha); background:var(--cartao); font-size:15px; cursor:pointer; }
  .abas button[aria-pressed="true"] { background:var(--marca); color:#fff; border-color:var(--marca); }
  .empresa { background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .empresa .cab { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .empresa .cab b { font-size:18px; }
  .foto-btn { white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; gap:6px; font-size:15px; padding:10px 14px; border-radius:10px; background:var(--laranja); color:#fff; font-weight:600; cursor:pointer; border:none; }
  .foto-btn.secundario { background:#fff; color:var(--tinta); border:1px solid var(--linha); font-weight:400; font-size:14px; padding:8px 12px; }
  .foto-btn input { display:none; }
  .nota { display:flex; gap:10px; border-top:1px dashed var(--linha); padding-top:8px; }
  .nota.cancelada { opacity:.5; }
  .nota img { width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--linha); cursor:zoom-in; background:#eee; flex-shrink:0; }
  .nota .info { display:flex; flex-direction:column; gap:4px; font-size:14px; flex:1; }
  .ok { color:var(--ok); }
  .falta { color:var(--suave); }
  .erro { color:var(--alerta); font-weight:600; }
  .acoes { display:flex; gap:6px; flex-wrap:wrap; }
  .acoes button { font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--linha); background:#fff; cursor:pointer; }
  .acoes button.conferir { background:var(--ok); color:#fff; border-color:var(--ok); font-weight:600; }
  .acoes button.problema { color:var(--alerta); border-color:var(--alerta); }
  .zoom { position:fixed; inset:0; background:#000d; z-index:20; display:flex; align-items:center; justify-content:center; padding:10px; }
  .zoom img { max-width:100%; max-height:100%; }
  .zoom.varias { flex-direction:column; justify-content:flex-start; overflow:auto; gap:10px; }
  .zoom.varias img { max-height:none; }
  .fundo-folha { position:fixed; inset:0; background:#0006; display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .folha { background:var(--cartao); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; max-height:92vh; overflow-y:auto; }
  .folha h2 { margin:0; font-size:19px; }
  .folha input[type=text] { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; box-sizing:border-box; }
  .opcoes { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .opcoes button { padding:12px 8px; border-radius:10px; border:1px solid var(--linha); background:#fff; font-size:15px; cursor:pointer; }
  .opcoes button[aria-pressed="true"] { background:var(--alerta); color:#fff; border-color:var(--alerta); font-weight:600; }
  .msg-erro { color:var(--alerta); font-size:14px; margin:0; min-height:1em; }
  table.mes { width:100%; border-collapse:collapse; font-size:14px; }
  table.mes th, table.mes td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--linha); }
  table.mes .n { text-align:right; }
  .pedido { background:#fbf6ef; border-radius:8px; padding:8px 10px; font-size:14px; display:flex; flex-direction:column; gap:6px; }
  .pedido .txt { white-space:pre-wrap; font-size:15px; }
  .alerta-linha { color:var(--alerta); font-size:14px; font-weight:600; }
  .folha textarea { font-size:16px; padding:10px; border:1px solid var(--linha); border-radius:10px; width:100%; box-sizing:border-box; font-family:inherit; }
  .folha input[inputmode], .folha input[type=date] { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; box-sizing:border-box; }
  .emp-mes { background:var(--cartao); border:1px solid var(--linha); border-left:4px solid var(--linha); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .emp-mes.pago { border-left-color:var(--ok); }
  .emp-mes.aberto { border-left-color:var(--laranja); }
  .emp-mes.atrasado { border-left-color:var(--alerta); background:#fff5f4; }
  .emp-mes .cab { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .emp-mes .acoes button.principal { background:var(--laranja); color:#fff; border-color:var(--laranja); font-weight:600; }
</style>
<script src="https://browser.sentry-cdn.com/11.1.0/bundle.min.js" crossorigin="anonymous"></script>
<script src="js/sentry.js"></script>

<body>
<header><div data-logo="pequeno"></div><h1>Empresas</h1><a href="turno.html">Voltar</a></header>
<main>
  <div class="abas" id="abas" hidden>
    <button aria-pressed="true" data-aba="dia">Dia</button>
    <button aria-pressed="false" data-aba="mes">Mês, cobrança e pagamento</button>
  </div>
  <section id="aba-dia" style="display:flex;flex-direction:column;gap:10px">
    <div class="cartao">
      <div class="campo" style="margin:0">Dia <input type="date" id="dia"></div>
      <p class="suave" id="resumo" style="margin:8px 0 0"></p>
      <p class="suave" style="margin:6px 0 0;font-size:13px">1. À noite: anote o pedido que chegou no WhatsApp (escolha o dia da entrega). 2. De manhã: separe conferindo o pedido e marque "Separei". 3. Lançou no Guappo e a empresa assinou: tire a foto da via assinada e coloque o valor.</p>
    </div>
    <div id="empresas" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
  <section id="aba-mes" hidden>
    <div class="cartao">
      <div class="campo" style="margin:0">Mês <input type="month" id="mes"></div>
      <div id="tabela" style="margin-top:8px"></div>
    </div>
  </section>
</main>

<div class="fundo-folha" id="fundo" hidden><div class="folha" id="folha"></div></div>
<div class="zoom" id="zoom" hidden><img alt="Nota assinada"></div>

<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, hoje, dataBR } from "./js/sessao.js";
import { pode } from "./js/equipe.js";
import { acrescentar, listar, listarEntre, ler, salvarComHistorico } from "./js/db.js";

const eu = await exigirUsuario();
if (!pode.notasEmpresas(eu)) location.href = "turno.html";
const podeConferir = pode.registrarNoLivro(eu); // Dara, Jéssica e Daiane (o Fábio só vê)
const podeFoto = pode.editarNotas(eu);
const veMes = pode.verPainel(eu);

// TECMAR, Tecsea e Redsea são contas diferentes no Guappo.
const EMPRESAS = ["ABG", "TWAS", "TECMAR", "Tecsea", "Redsea", "LANDSEAAIR", "Artemis", "Cliente Bruno", "Secretaria da Prefeitura"];
const PROBLEMAS = { sem_via: "Faltou a via na pasta", sem_assinatura: "Via sem assinatura", fora_guappo: "Não está no Guappo", outro: "Outro problema" };
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const agora = () => new Date().toTimeString().slice(0, 5);
const campoDia = document.getElementById("dia");
campoDia.value = hoje();

// A foto fica guardada à parte (coleção notas_fotos); aqui só os registros leves. Nada se altera nem se apaga.
function montar(registros, tipo = "nota") {
  const passos = registros.filter((r) => r.refId);
  const ultimo = (id, t) => passos.filter((r) => r.refId === id && r.tipo === t).sort((a, b) => a.criadoEm.localeCompare(b.criadoEm)).at(-1);
  return registros.filter((r) => r.tipo === tipo).sort((a, b) => a.criadoEm.localeCompare(b.criadoEm))
    .map((n) => { const it = ultimo(n.id, "itens"); const ft = ultimo(n.id, "foto");
      return { ...n, ...(it ? { itens: it.itens, itensConfere: it.confere !== false } : {}), ...(ft && !n.fotoId ? { fotoId: ft.fotoIds[0], fotoIds: ft.fotoIds, fotoGrupo: true } : {}), conferido: ultimo(n.id, "conferido"), cancelado: ultimo(n.id, "cancelado"), separado: ultimo(n.id, "separado") }; });
}
const reais = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const numero = (t) => { t = String(t ?? "").trim(); return Number(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t); };

// Versão menor da foto só para mandar à IA (envio mais rápido em internet fraca; o texto do cupom continua legível).
// Foto para a IA: recorta só o papel (parte clara), deixa em tons de cinza e pequena (~100 KB), para subir rápido na internet da loja.
function menorParaIA(dataUrl) {
  return new Promise((ok) => {
    const img = new Image();
    img.onload = () => {
      try {
        // 1) acha o papel numa versão pequena
        const W = 240, e0 = W / Math.max(img.width, img.height);
        const c0 = document.createElement("canvas"); c0.width = Math.round(img.width * e0); c0.height = Math.round(img.height * e0);
        const x0 = c0.getContext("2d"); x0.drawImage(img, 0, 0, c0.width, c0.height);
        const d0 = x0.getImageData(0, 0, c0.width, c0.height).data, w0 = c0.width, h0 = c0.height; c0.width = c0.height = 0;
        const lum = []; for (let k = 0; k < d0.length; k += 4) lum.push(0.299 * d0[k] + 0.587 * d0[k + 1] + 0.114 * d0[k + 2]);
        const ord = [...lum].sort((a, b) => a - b), lim = Math.max(140, ord[Math.floor(ord.length * 0.97)] * 0.82);
        const cols = new Array(w0).fill(0), rows = new Array(h0).fill(0);
        for (let y = 0; y < h0; y++) for (let x = 0; x < w0; x++) if (lum[y * w0 + x] >= lim) { cols[x]++; rows[y]++; }
        const faixa = (arr, min) => { const a = arr.findIndex((v) => v >= min), b = arr.length - 1 - [...arr].reverse().findIndex((v) => v >= min); return a < 0 ? [0, arr.length - 1] : [a, b]; };
        let [xa, xb] = faixa(cols, Math.max(...cols) * 0.45), [ya, yb] = faixa(rows, Math.max(...rows) * 0.35);
        if (xb - xa < w0 * 0.25 || yb - ya < h0 * 0.25) { xa = 0; ya = 0; xb = w0 - 1; yb = h0 - 1; }
        const m = 6; xa = Math.max(0, xa - m); ya = Math.max(0, ya - m); xb = Math.min(w0 - 1, xb + m); yb = Math.min(h0 - 1, yb + m);
        // 2) recorte em até 1400 px no lado maior, cinza, JPEG
        const sx = xa / e0, sy = ya / e0, sw = (xb - xa + 1) / e0, sh = (yb - ya + 1) / e0;
        const e = Math.min(1.6, 1400 / Math.max(sw, sh));
        const c = document.createElement("canvas"); c.width = Math.round(sw * e); c.height = Math.round(sh * e);
        const x = c.getContext("2d"); x.filter = "grayscale(1) contrast(1.25)"; x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        let url = c.toDataURL("image/jpeg", 0.7);
        if (url.length > 260000) url = c.toDataURL("image/jpeg", 0.55);
        c.width = c.height = 0; ok(url);
      } catch { ok(dataUrl); }
    };
    img.onerror = () => ok(dataUrl);
    img.src = dataUrl;
  });
}
// Reduz a foto para caber no banco (cerca de 150 KB) sem perder a leitura do número e da assinatura.
function reduzir(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      let lado = 1400, qualidade = 0.7, url;
      do {
        const escala = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL("image/jpeg", qualidade);
        c.width = c.height = 0; // libera a memória já (o iPhone tem limite e a próxima foto sairia em branco)
        lado -= 200; qualidade -= 0.05;
      } while (url.length > 700000 && lado > 500);
      URL.revokeObjectURL(img.src);
      ok(url);
    };
    img.onerror = falha;
    img.src = URL.createObjectURL(arquivo);
  });
}

const miniaturas = {};
// Abre a foto grande; nota com foto do grupo mostra todas as fotos (role para ver).
async function verFotos(ids) {
  const z = document.getElementById("zoom");
  const srcs = await Promise.all(ids.map((id) => (miniaturas[id] ??= ler("notas_fotos", id).then((d) => d?.foto || ""))));
  z.classList.toggle("varias", srcs.length > 1);
  z.innerHTML = srcs.map((src) => `<img src="${src}" alt="Nota assinada">`).join("");
  z.hidden = false;
}
async function miniatura(fotoId, el) {
  if (!fotoId) { el.alt = "Sem foto"; el.style.background = "var(--linha)"; return; }
  miniaturas[fotoId] ??= ler("notas_fotos", fotoId).then((d) => d?.foto || "");
  el.src = await miniaturas[fotoId];
}

const diaAntes = (d) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() - 1); return x.toISOString().slice(0, 10); };
async function mostrar() {
  const d = campoDia.value;
  const regsDia = await listar("notas", "data", d);
  const notas = montar(regsDia);
  const pedidos = montar(regsDia, "pedido").filter((p) => !p.cancelado);
  const ativas = notas.filter((n) => !n.cancelado);
  const semConferir = ativas.filter((n) => !n.conferido).length;
  const problemas = ativas.filter((n) => n.conferido && !n.conferido.ok).length;
  const comNota = new Set(ativas.map((n) => n.empresa)).size;
  document.getElementById("resumo").innerHTML = `${dataBR(d)} · ${comNota} empresa(s) com nota` +
    (semConferir ? ` · <span class="selo pendente">${semConferir} sem conferir</span>` : "") +
    (pedidos.filter((p) => !p.separado).length ? ` · <span class="selo pendente">${pedidos.filter((p) => !p.separado).length} pedido(s) sem separar</span>` : "") +
    (problemas ? ` · <span class="selo alerta">${problemas} com problema</span>` : "") +
    (ativas.length && !semConferir && !problemas ? ` · <span class="selo ok">tudo conferido</span>` : "") +
    (!ativas.length ? `<br><b>Nenhuma nota neste dia${d === hoje() ? " ainda (o dia virou à meia-noite)" : ""}.</b> <button class="botao" id="dia-ant" style="padding:6px 10px;margin-top:6px">← Ver dia ${dataBR(diaAntes(d)).slice(0, 5)}</button>` : "");
  document.getElementById("dia-ant")?.addEventListener("click", () => { campoDia.value = diaAntes(d); mostrar(); });

  const box = document.getElementById("empresas");
  box.innerHTML = "";
  for (const nome of EMPRESAS) {
    const minhas = notas.filter((n) => n.empresa === nome);
    const meusPedidos = pedidos.filter((p) => p.empresa === nome);
    const div = document.createElement("div");
    div.className = "empresa";
    div.innerHTML = `<div class="cab"><b>${esc(nome)}</b>${minhas.length ? "" : `<span class="suave">sem nota</span>`}</div>`;
    for (const p of meusPedidos) div.append(blocoPedido(p, minhas.some((n) => !n.cancelado)));
    if (d >= hoje() && podeFoto && !meusPedidos.length) {
      const b = document.createElement("button"); b.className = "foto-btn secundario"; b.style.alignSelf = "flex-start";
      b.textContent = "+ Anotar pedido do WhatsApp"; b.onclick = () => folhaPedido(nome, d); div.append(b);
    }
    // Equipe lança a nota do dia (só câmera); a Daiane também lança notas de dias anteriores e pode escolher foto da galeria.
    if (podeFoto && (d === hoje() || (eu.papel === "dona" && d < hoje()))) {
      const rot = document.createElement("label");
      rot.className = "foto-btn" + (minhas.length ? " secundario" : "");
      rot.innerHTML = `${minhas.length ? "📷 Outra nota" : "📷 Foto da nota"}<input type="file" accept="image/*" ${d === hoje() && eu.papel !== "dona" ? 'capture="environment"' : ""}>`;
      rot.querySelector("input").onchange = (e) => e.target.files[0] && folhaValor(nome, e.target.files[0]);
      div.querySelector(".cab").append(rot);
    }
    for (const n of minhas) div.append(linhaNota(n));
    box.append(div);
  }
}

const itensNota = (n) => n.itens?.length ? `<span style="font-size:14px">${n.itens.map((i) => `${esc(String(i.qtd).replace(".", ","))} ${esc(i.descricao)}`).join(" · ")}${n.itensConfere === false ? ` <span class="falta">(conferir: a soma dos itens não bate com o valor)</span>` : ""}</span>` : "";
function linhaNota(n) {
  const div = document.createElement("div");
  div.className = "nota" + (n.cancelado ? " cancelada" : "");
  const img = document.createElement("img");
  img.alt = `Nota ${n.empresa}`;
  img.onclick = () => { if (n.fotoId) verFotos(n.fotoIds || [n.fotoId]); };
  miniatura(n.fotoId, img);
  const conf = n.cancelado ? `<span class="falta">Cancelada por ${esc(n.cancelado.registradoPor)}: ${esc(n.cancelado.motivo)}</span>`
    : !n.conferido ? `<span class="falta">○ Falta a conferência da Dara</span>`
    : n.conferido.ok ? `<span class="ok">✓ Na pasta · conferido por ${esc(n.conferido.registradoPor)} às ${esc(n.conferido.hora)}</span>`
    : `<span class="erro">✗ ${esc(PROBLEMAS[n.conferido.problema])}${n.conferido.detalhe ? `: ${esc(n.conferido.detalhe)}` : ""} (${esc(n.conferido.registradoPor)}, foi para o Livro)</span>`;
  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML = `${n.valor != null ? `<span style="font-size:16px"><b>${reais(n.valor)}</b>${n.pedidoGuappo ? ` <span class="suave">· Guappo nº ${esc(n.pedidoGuappo)}</span>` : ""}${n.setor ? ` <span class="suave">· ${esc(n.setor)}</span>` : ""}</span>` : `<span class="erro">Sem valor</span>`}
    ${itensNota(n)}<span class="ok">✓ Foto por ${esc(n.registradoPor)} às ${esc(n.hora)}</span>${conf}<div class="acoes"></div>`;
  const acoes = info.querySelector(".acoes");
  if (podeConferir && !n.conferido && !n.cancelado && (campoDia.value === hoje() || eu.papel === "dona")) {
    const b = (t, c, f) => { const x = document.createElement("button"); x.textContent = t; x.className = c; x.onclick = f; acoes.append(x); };
    b("Na pasta, certo", "conferir", () => gravar(n, { tipo: "conferido", ok: true }));
    b("Problema", "problema", () => folhaProblema(n));
    b("Foto errada", "", () => { const m = prompt("Por que anular esta foto?"); if (m?.trim()) gravar(n, { tipo: "cancelado", motivo: m.trim() }); });
  }
  if (["dona", "lider"].includes(eu.papel) && !n.cancelado && n.fotoId && !n.fotoGrupo) {
    const x = document.createElement("button"); x.textContent = "Ler nota de novo"; x.className = "conferir";
    x.onclick = async () => {
      x.disabled = true; x.textContent = "Lendo a foto…";
      try {
        const r = await lerItensDeNovo(n);
        const soma = Math.round(r.itens.reduce((t, i) => t + (i.total || 0), 0) * 100) / 100;
        await gravar(n, { tipo: "itens", itens: r.itens, confere: n.valor == null || Math.abs(soma - n.valor) < 0.05 });
      } catch (e) { x.disabled = false; x.textContent = "Tentar ler de novo"; alert(`Não consegui ler: ${String(e?.message || e).slice(0, 150)}`); }
    };
    acoes.append(x);
  }
  div.append(img, info);
  return div;
}

// Foto da via assinada + valor do Guappo (sem valor não salva: é o que vira a cobrança do mês).
async function folhaValor(empresa, arquivo) {
  let foto = null, itens = [];
  let d = campoDia.value <= hoje() ? campoDia.value : hoje();
  const dona = eu.papel === "dona";
  folha.innerHTML = `<h2>Nota · ${esc(empresa)}</h2>
    <img id="v-img" alt="Nota" style="max-height:200px;object-fit:contain;border-radius:8px" hidden><p class="suave" id="v-prep" style="margin:0">Preparando a foto…</p>
    ${dona ? `<label class="suave" for="v-dia">Dia da nota</label><input type="date" id="v-dia" value="${d}" max="${hoje()}">` : `<p class="suave" style="margin:0">Dia: <b>${dataBR(d)}</b></p>`}
    <p class="aviso" id="v-aviso" style="margin:0" hidden></p>
    <div id="v-itens"></div>
    <label class="suave" for="v-valor">Valor da nota no Guappo (R$)</label><input id="v-valor" inputmode="decimal" placeholder="0,00">
    <label class="suave" for="v-num">Número do pedido no Guappo (se tiver)</label><input id="v-num" inputmode="numeric">
    <div id="v-setor-box" hidden><label class="suave" for="v-setor">Setor escrito na nota</label><select id="v-setor"><option value="">Sem setor</option></select></div>
    <p class="msg-erro" id="v-e"></p>

  fundo.hidden = false;

    }

      const fotoId = await acrescentar("notas_fotos", { ...base, foto });
      notaSalva = { ...base, id: await acrescentar("notas", { ...base, tipo: "nota", fotoId, valor: Math.round(valor * 100) / 100, pedidoGuappo: num, itens, ...($("#v-setor").value ? { setor: $("#v-setor").value } : {}) }), valor, semItens: !itens.length };
      salvou = true; fundo.hidden = true;
      // A tela continua no dia em que a Daiane está; só avisa se a nota foi guardada em outro dia.
      mostrar();
      if (d !== campoDia.value) avisoTopo(`Nota da ${empresa} salva no dia ${dataBR(d)} (o dia escrito na nota). Para ver, escolha ${dataBR(d)} lá em cima ou abra "Mês" → "Ver o mês dia a dia".`);
    } catch { $("#v-e").textContent = "Não consegui enviar. Verifique a internet e tente de novo."; e.target.disabled = false; }
  };
  try { foto = await reduzir(arquivo); const i = $("#v-img"); i.src = foto; i.hidden = false; }
  catch { $("#v-prep").textContent = "Não consegui ler a foto. Feche e tente de novo."; return; }
  // Primeiro a IA (rápida com o plano pago). A leitura do celular, que pesa no aparelho, só começa se a IA falhar ou passar de 8s.
  let r = null, motivo = "", doCelular = false, ia = null;
  const t0 = Date.now();
  const rel = setInterval(() => { const p = $("#v-prep"); if (p && viva()) p.textContent = `Lendo a nota… ${Math.round((Date.now() - t0) / 1000)}s. Se quiser, já pode digitar o valor e salvar, sem esperar.`; }, 1000);
  let iaLeu = false, kb = 0;

    ia = await import("./js/ia.js?v=9");
    if (!ia.iaDisponivel) throw new Error("sem IA");
    const pequena = await menorParaIA(foto); kb = Math.round(pequena.length * 0.75 / 1024);
    const x = await Promise.race([ia.lerComprovanteIA(pequena, EMPRESAS), new Promise((_, n) => setTimeout(() => n(new Error(`a IA demorou mais de 48s (parou em: ${ia.etapa || "?"})`)), 48000))]);
    if (!x.itens.length && !x.total) throw new Error("a IA não achou os itens");

  peloCelular.catch(() => {});

  try { r = await daIA; } catch (err) { console.error(err); motivo = String(err?.message || err).slice(0, 220); }
  if (!r) {
    const o = await peloCelular.catch((e) => { console.error(e); motivo += ` · celular: ${String(e?.message || e).slice(0, 80)}`; return null; });
    if (o) motivo += ` · celular achou ${o.itens.length} item(ns), total ${o.totalLido ? "sim" : "não"}, número ${o.numero ? "sim" : "não"}, soma ${o.confere ? "bate" : "não bate"}`;
    if (o?.confere) { r = { ...o, escrito: "", empresa: "" }; doCelular = true; }
    else if (o?.totalLido || o?.numero) { r = { ...o, itens: [], total: o.totalLido ? o.total : 0, escrito: "", empresa: "", parcial: true }; doCelular = true; }

  try { if (!r || doCelular) window.Sentry?.captureMessage(`Leitura da nota: ${r ? "lida pelo celular" : "não leu"} · ${motivo} · foto ${kb} KB · ${Math.round((Date.now() - t0) / 1000)}s`, r ? "warning" : "error"); } catch {}

    // Nota sem data (Guappo imprime 01/01/0001 quando sai como "consumidor não identificado"): vale o dia escrito à mão.
    if (r.emissao && (r.emissao < "2020-01-01" || r.emissao > hoje())) {

      const mao = m ? `${hoje().slice(0, 4)}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : "";
      r.emissao = "";
      if (mao && /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(mao) && mao <= hoje() && mao !== d && dona) { d = mao; $("#v-dia").value = d; avisos.push(`A nota saiu sem data no Guappo. Usei o dia escrito à mão: <b>${dataBR(mao)}</b>.`); }
      else avisos.push(`A nota saiu sem data no Guappo. Ficou o dia <b>${dataBR(d)}</b>: confira.`);
      r.empresa = "";
    }
    if (r.emissao && r.emissao !== d) {

      else avisos.push(`A nota diz emissão em <b>${dataBR(r.emissao)}</b>. Confira se é a nota certa.`);
    }
    if (r.empresa && r.empresa !== empresa) avisos.push(`No papel está escrito "${esc(r.escrito)}". Parece ser da <b>${esc(r.empresa)}</b>, não da ${esc(empresa)}. Confira antes de salvar.`);

    $("#v-prep").textContent = r.parcial ? `A IA não respondeu (${motivo.split(" · celular")[0]}). O celular leu só ${r.total ? "o total" : ""}${r.total && r.numero ? " e " : ""}${r.numero ? "o número" : ""}: CONFIRA com a nota antes de salvar.`

  }
}

const campoMes = document.getElementById("mes");
campoMes.value = hoje().slice(0, 7);
const cobra = eu.papel === "dona";
const FORMAS = ["PIX", "Dinheiro", "Transferência", "Boleto"];
const mesBR = (m) => m.split("-").reverse().join("/");
const proxDia10 = (m) => { const [a, mm] = m.split("-").map(Number); const d = new Date(a, mm, 10); return d.toISOString().slice(0, 10); };
async function situacaoEmpresas(mes) {
  // Notas do mês anterior e deste: a empresa com "dia de corte" (ex.: LSA paga do dia 21 ao dia 20) pega o período dela.
  const [a, m] = mes.split("-").map(Number);
  const mesAnt = `${m === 1 ? a - 1 : a}-${String(m === 1 ? 12 : m - 1).padStart(2, "0")}`;
  const [regs, cobs] = await Promise.all([listarEntre("notas", "data", `${mesAnt}-01`, `${mes}-31`), listar("cobrancas", "mes", mes)]);
  const notas = montar(regs).filter((n) => !n.cancelado);
  const pedidos = montar(regs, "pedido").filter((p) => !p.cancelado);
  const canc = new Set(cobs.filter((c) => c.tipo === "cancelamento").map((c) => c.refId));
  const ok = cobs.filter((c) => !canc.has(c.id)).sort((x, y) => x.criadoEm.localeCompare(y.criadoEm));
  return EMPRESAS.map((e) => {
    const [de, ate] = periodoEmpresa(e, mes);
    const ns = notas.filter((n) => n.empresa === e && n.data >= de && n.data <= ate).sort((x, y) => x.data.localeCompare(y.data));
    const total = ns.reduce((t, n) => t + (n.valor || 0), 0);
    const cobranca = ok.filter((c) => c.tipo === "cobranca" && c.empresa === e).at(-1);
    const pagos = ok.filter((c) => c.tipo === "pagamento" && c.empresa === e);
    const pago = pagos.reduce((t, c) => t + c.valor, 0);
    const devido = cobranca ? cobranca.total : total;
    const falta = Math.round((devido - pago) * 100) / 100;
    const estado = !ns.length && !cobranca ? "vazio" : falta <= 0.009 && (cobranca || pago) ? "pago" : cobranca && hoje() > cobranca.vencimento ? "atrasado" : cobranca ? "aberto" : "sem";
    const pedidosSemNota = pedidos.filter((p) => p.empresa === e && p.data >= de && p.data <= ate && p.data < hoje() && !ns.some((n) => n.data === p.data));
    return { empresa: e, de, ate, ns, total, cobranca, pagos, pago, falta, estado, semValor: ns.filter((n) => n.valor == null).length,
      problemas: ns.filter((n) => n.conferido && !n.conferido.ok).length, semConferir: ns.filter((n) => !n.conferido).length, pedidosSemNota };
  });
}
async function mostrarMes() {
  const mes = campoMes.value;
  await carregarDadosEmp();
  const sit = (await situacaoEmpresas(mes)).filter((x) => x.estado !== "vazio");
  const t = (f) => sit.reduce((s, x) => s + f(x), 0);
  const ROT = { pago: ["Pago", "ok"], aberto: ["Cobrado, esperando", "pendente"], atrasado: ["ATRASADO", "alerta"], sem: ["Falta cobrar", "pendente"] };
  const box = document.getElementById("tabela");
  box.innerHTML = sit.length ? `<p style="margin:0 0 8px">Total do mês: <b>${reais(t((x) => x.total))}</b> · recebido ${reais(t((x) => x.pago))} · falta <b>${reais(t((x) => Math.max(0, x.falta)))}</b></p>
    <div id="emps" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="todas" class="cartao" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div>
    <p class="suave" style="font-size:13px">Confira com o relatório a prazo de cada empresa no Guappo antes de cobrar.</p>`

async function lerItensDeNovo(n) {

}

function folhaLancar(texto = "") {
  folha.innerHTML = `<h2>Lançar notas transcritas</h2>

    <div id="l-lista"></div><p class="msg-erro" id="l-e"></p>

  $("#l-ver").onclick = async () => {
    $("#l-e").textContent = ""; $("#l-lista").innerHTML = "Conferindo…";
    const ano = hoje().slice(0, 4), linhas = [], erros = [];
    for (const [k, l] of $("#l-t").value.split("\n").entries()) {
      const c = l.split(";"); if (c.length < 4) continue;
      const [emp, dm, num, val, its = ""] = c.map((x) => x.trim());
      const m = dm.match(/^(\d{1,2})\/(\d{1,2})$/), valor = numero(val);
      const data = m ? `${ano}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : "";
      if (!EMPRESAS.includes(emp) || !data || !(valor > 0) || data > hoje()) { erros.push(`linha ${k + 1}: ${l.slice(0, 40)}`); continue; }
      const itens = its ? its.split("|").map((x) => { const r = x.match(/^([\d.,]+)\s*(kg)?\s+(.+?)=([\d.,]+)$/i); if (!r) return null; const qtd = numero(r[1]), total = numero(r[4]); return { descricao: r[3].trim(), qtd, preco: Math.round((total / qtd) * 100) / 100, total }; }).filter(Boolean) : [];
      linhas.push({ empresa: emp, data, pedidoGuappo: num.replace(/\D/g, ""), valor, itens });
    }

    const vistos = new Set();
    for (const x of linhas) { x.repetida = existentes.has(x.pedidoGuappo) || existentes.has(`${x.empresa}|${x.data}|${x.valor.toFixed(2)}`) || vistos.has(x.pedidoGuappo); if (x.pedidoGuappo) vistos.add(x.pedidoGuappo); }
    const novas = linhas.filter((x) => !x.repetida);
    const tot = novas.reduce((s, x) => s + x.valor, 0);
    $("#l-lista").innerHTML = `<p style="margin:6px 0"><b>${novas.length} nota(s) novas · ${reais(tot)}</b>${linhas.length - novas.length ? ` · ${linhas.length - novas.length} já lançada(s), ficam de fora` : ""}${erros.length ? `<br><span class="falta">${erros.length} linha(s) que não entendi: ${esc(erros.slice(0, 3).join(" · "))}</span>` : ""}</p>
      <div style="max-height:40vh;overflow:auto;border:1px solid var(--linha);border-radius:8px;padding:6px;font-size:14px">${linhas.map((x) => `<div style="padding:3px 0;border-bottom:1px solid var(--linha)${x.repetida ? ";opacity:.45;text-decoration:line-through" : ""}">${dataBR(x.data).slice(0, 5)} · <b>${esc(x.empresa)}</b> · nº ${esc(x.pedidoGuappo)} · <b>${reais(x.valor)}</b>${x.repetida ? ` <span style="text-decoration:none;display:inline-block">(já está no sistema, não entra de novo)</span>` : ""}<br><span class="suave">${esc(x.itens.map((i) => `${String(i.qtd).replace(".", ",")} ${i.descricao}`).join(" · "))}</span></div>`).join("")}</div>
      ${novas.length ? `<button class="botao principal" id="l-ok">Lançar ${novas.length} nota(s)</button>` : ""}`;
    const ok = $("#l-ok"); if (!ok) return;
    ok.onclick = async () => {
      ok.disabled = true;
      try {
        let fotoId = null;
        const arq = $("#l-f").files[0];
        if (arq) fotoId = await acrescentar("notas_fotos", { empresa: "várias", data: hoje(), mes: hoje().slice(0, 7), hora: agora(), registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString(), foto: await reduzir(arq) });
        let k = 0;
        for (const { repetida, ...x } of novas) {
          ok.textContent = `Lançando ${++k} de ${novas.length}…`;
          await acrescentar("notas", { ...x, tipo: "nota", fotoId, mes: x.data.slice(0, 7), lancadaDepois: true, transcrita: true, hora: agora(), registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() });
        }
        $("#l-lista").innerHTML = `<p class="ok">Pronto: ${novas.length} nota(s) lançadas. Veja em "Conferir todas as notas".</p>`;
      } catch (e) { $("#l-e").textContent = "Parou no meio por falta de internet. Toque em Conferir a lista de novo: as que já entraram ficam de fora."; ok.disabled = false; }
    };
  };
  fundo.hidden = false;
}
function verNotasMes(x) {
  folha.innerHTML = `<h2>${esc(x.empresa)} · notas do mês</h2>
    <div style="display:flex;flex-direction:column;gap:8px">${x.ns.map((n) => `<div class="nota"><img data-foto="${esc(n.fotoId || "")}" data-fotos="${esc((n.fotoIds || [n.fotoId || ""]).join(","))}" alt="Nota"><div class="info"><b>${dataBR(n.data)} · ${n.valor != null ? reais(n.valor) : "sem valor"}</b>
      ${itensNota(n)}<span class="suave">${n.conferido ? (n.conferido.ok ? "✓ conferida" : "✗ " + esc(PROBLEMAS[n.conferido.problema])) : "sem conferir"}</span></div></div>`).join("") || `<p class="suave">Nenhuma nota.</p>`}</div>
    <button class="botao" id="n-x" style="text-align:center">Fechar</button>`;
  folha.querySelectorAll("img[data-foto]").forEach((img) => { miniatura(img.dataset.foto, img); img.onclick = () => { if (img.dataset.foto) verFotos(img.dataset.fotos.split(",")); }; });
  folha.querySelector("#n-x").onclick = () => { fundo.hidden = true; };
  fundo.hidden = false;
}
campoMes.onchange = mostrarMes;
campoDia.onchange = mostrar;

if (veMes) {
  const abas = document.getElementById("abas");
  abas.hidden = false;
  abas.onclick = (e) => {
    const aba = e.target.closest("button")?.dataset.aba; if (!aba) return;
    abas.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.aba === aba));
    document.getElementById("aba-dia").hidden = aba !== "dia";
    document.getElementById("aba-mes").hidden = aba !== "mes";
    if (aba === "mes") mostrarMes();
  };
  // A Daiane abre direto no mês, com todas as notas na tela.
  if (eu.papel === "dona") abas.querySelector('[data-aba="mes"]').click();
}
// Link "Lançar as notas" que o Claude manda: as notas vêm no próprio link (depois do #, não passa por nenhum servidor).
if (eu.papel === "dona" && location.hash.startsWith("#lancar=")) {
  (async () => {
    try {
      const b64 = location.hash.slice(8).replace(/-/g, "+").replace(/_/g, "/");
      const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      const texto = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
      history.replaceState(null, "", location.pathname + location.search);
      folhaLancar(texto);
    } catch (e) { console.error(e); alert("Não consegui abrir as notas do link. Peça um link novo ao Claude."); }
  })();
}
mostrar();
// Liga o leitor de notas do celular logo que a tela abre, para a primeira foto não esperar o download.
if (podeFoto) setTimeout(() => import("./js/lernota.js?v=5").then((m) => m.aquecer()).catch(() => {}), 1500);
</script>
