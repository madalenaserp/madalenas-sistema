<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Pedidos do balcão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  [hidden] { display:none !important; }
  .ped { background:var(--cartao); border:1px solid var(--linha); border-left:4px solid var(--laranja); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .ped.primeiro { border-left-width:8px; box-shadow:0 2px 10px #e2732b33; }
  .ped.pronto { border-left-color:var(--ok); }
  .ped.entregue, .ped.cancelado { opacity:.6; border-left-color:var(--linha); }
  .ped .topo { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .ped .num { font-size:26px; font-weight:800; }
  .ped .onde { font-weight:700; font-size:17px; }
  .ped .itens { font-size:17px; }
  .ped .acoes { display:flex; gap:6px; flex-wrap:wrap; }
  .ped .acoes button { font-size:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--linha); background:#fff; cursor:pointer; }
  .ped .acoes button.avancar { background:var(--laranja); color:#fff; border-color:var(--laranja); font-weight:600; }
  .ped .acoes button.entregar { background:var(--ok); color:#fff; border-color:var(--ok); font-weight:600; }
  .titulo-grupo { margin:8px 0 0; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--suave); font-size:14px; }
  .fundo-folha { position:fixed; inset:0; background:#0006; display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .folha { background:var(--cartao); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; max-height:92vh; overflow-y:auto; }
  .folha h2 { margin:0; font-size:19px; }
  .folha label.rot { font-size:14px; color:var(--suave); margin-bottom:-4px; }
  .folha input, .folha select { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; box-sizing:border-box; font-family:inherit; }
  .opcoes { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .opcoes.duas { grid-template-columns:1fr 1fr; }
  .opcoes button { padding:12px 6px; border-radius:10px; border:1px solid var(--linha); background:#fff; font-size:15px; cursor:pointer; }
  .opcoes button[aria-pressed="true"] { background:var(--laranja); color:#fff; border-color:var(--laranja); font-weight:600; }
  .erro { color:var(--alerta); font-size:14px; margin:0; min-height:1em; }
  #impressao { display:none; }
  @media print {
    @page { size:80mm auto; margin:0; }
    body { background:#fff !important; }
    body > *:not(#impressao) { display:none !important; }
    #impressao { display:block; width:64mm; margin:0 4mm 0 9mm; padding:2mm 0 6mm; font-family:Arial, sans-serif; color:#000; font-size:12pt; line-height:1.25; }
    #impressao h1 { font-size:14pt; text-align:center; margin:0; }
    #impressao .centro { text-align:center; }
    #impressao .numero { font-size:30pt; font-weight:800; text-align:center; margin:1mm 0; }
    #impressao .grande { font-size:16pt; font-weight:700; text-align:center; }
    #impressao hr { border:none; border-top:1px dashed #000; margin:2mm 0; }
    #impressao p { margin:1mm 0; }
    #impressao .pedido { font-size:14pt; font-weight:700; }
    #impressao .pedido ul { margin:0; padding-left:5mm; }
    #impressao .pedido li { margin:0 0 1.5mm; }
  }
</style>
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Pedidos do balcão</h1><a href="turno.html">Voltar</a></header>
<main>
  <div class="cartao" id="resumo"></div>
  <button class="botao principal" id="novo">+ Novo pedido</button>
  <div class="cartao suave" style="font-size:14px">Os pedidos ficam na <b>ordem de chegada</b>: só o primeiro da fila pode ser marcado como pronto, assim nenhum pedido passa na frente do outro. A comanda sai na impressora com o número do pedido.</div>
  <div id="lista" style="display:flex;flex-direction:column;gap:8px"></div>
</main>

<div id="impressao"></div>
<div class="fundo-folha" id="fundo" hidden><div class="folha" id="folha"></div></div>

<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, hoje, dataBR } from "./js/sessao.js";
import { pode } from "./js/equipe.js";
import { acrescentar, listar } from "./js/db.js";
import { campoItens, itensEmTexto, itensEmHtml } from "./js/itens.js";

const eu = await exigirUsuario();
const leitura = pode.somenteLeitura(eu);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const agora = () => new Date().toTimeString().slice(0, 5);
const MESAS = ["1", "2", "3", "4", "5", "6", "Balcão", "Viagem"];
const ondeTexto = (o) => /^\d+$/.test(o) ? `Mesa ${o}` : o === "Viagem" ? "Para viagem" : "No balcão";

// Número do pedido = posição na ordem de chegada do dia (não depende de ninguém digitar).
function montar(regs) {
  const eventos = regs.filter((r) => r.tipo === "status").sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""));
  return regs.filter((r) => r.tipo === "pedido").sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""))
    .map((p, i) => {
      const ult = eventos.filter((e) => e.refId === p.id).at(-1);
      return { ...p, numero: i + 1, status: ult?.para || "fila", motivo: ult?.motivo, statusPor: ult?.registradoPor, statusHora: ult?.hora };
    });
}

async function mostrar() {
  const todos = montar(await listar("balcao", "data", hoje()));
  const fila = todos.filter((p) => p.status === "fila");
  const prontos = todos.filter((p) => p.status === "pronto");
  const fim = todos.filter((p) => p.status === "entregue" || p.status === "cancelado").reverse();
  document.getElementById("resumo").innerHTML = `<h2 style="margin:0">Hoje, ${dataBR(hoje())}</h2>
    <p class="suave" style="margin:6px 0 0">${fila.length} na fila · ${prontos.length} pronto(s) para entregar · ${todos.filter((p) => p.status === "entregue").length} entregue(s)</p>`;
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  const grupo = (titulo, itens, fn) => {
    if (!itens.length) return;
    const t = document.createElement("p"); t.className = "titulo-grupo"; t.textContent = titulo; lista.append(t);
    itens.forEach(fn);
  };
  grupo("Na fila (ordem de chegada)", fila, (p, i) => lista.append(cartao(p, i === 0 ? "primeiro" : fila[0].numero)));
  grupo("Prontos: entregar ao cliente", prontos, (p) => lista.append(cartao(p)));
  if (fim.length) {
    const d = document.createElement("details");
    d.innerHTML = `<summary class="suave" style="cursor:pointer;padding:8px 0">Entregues e cancelados (${fim.length})</summary>`;
    fim.forEach((p) => d.append(cartao(p)));
    lista.append(d);
  }
  if (!todos.length) lista.innerHTML = `<p class="suave">Nenhum pedido hoje ainda.</p>`;
}

function cartao(p, posicao) {
  const div = document.createElement("div");
  div.className = `ped ${p.status}${posicao === "primeiro" ? " primeiro" : ""}`;
  const selo = { fila: posicao === "primeiro" ? "Próximo a sair" : "Na fila", pronto: "Pronto", entregue: "Entregue", cancelado: "Cancelado" }[p.status];
  div.innerHTML = `
    <div class="topo"><span class="num">#${p.numero}</span><span class="onde">${esc(ondeTexto(p.onde))}</span><span class="suave">${esc(p.hora)}</span></div>
    ${p.cliente ? `<div><b>${esc(p.cliente)}</b></div>` : ""}
    <div class="itens">${itensEmHtml(p)}</div>
    ${p.obs ? `<div class="suave">Obs: ${esc(p.obs)}</div>` : ""}
    <div><span class="selo ${p.status === "pronto" || p.status === "entregue" ? "ok" : "pendente"}" style="margin-left:0">${selo}${p.statusPor ? ` · ${esc(p.statusPor)} às ${esc(p.statusHora)}` : ""}</span>
      <span class="selo ${p.pago ? "ok" : "alerta"}">${p.pago ? "Pago" : "Paga no fim"}</span></div>
    ${p.motivo ? `<div class="suave">Cancelado: ${esc(p.motivo)}</div>` : ""}
    <div class="suave" style="font-size:13px">Anotado por ${esc(p.registradoPor)}</div>
    <div class="acoes"></div>`;
  const acoes = div.querySelector(".acoes");
  if (!leitura && (p.status === "fila" || p.status === "pronto")) {
    if (p.status === "fila") {
      if (posicao === "primeiro") acoes.append(botao("✓ Pronto", "avancar", () => registrar(p, { para: "pronto" })));
      else acoes.append(Object.assign(document.createElement("span"), { className: "suave", style: "font-size:14px;align-self:center", textContent: `Sai depois do #${posicao}` }));
    } else acoes.append(botao("Entregue ao cliente", "entregar", () => registrar(p, { para: "entregue" })));
    acoes.append(botao("🖨 Comanda", "", () => imprimir(p)));
    acoes.append(botao("Cancelar", "", async () => {
      const motivo = prompt(`Por que cancelar o pedido #${p.numero}?`);
      if (motivo?.trim()) await registrar(p, { para: "cancelado", motivo: motivo.trim() });
    }));
  }
  return div;
}

function botao(texto, classe, acao) {
  const b = document.createElement("button");
  b.textContent = texto; b.className = classe;
  b.onclick = async () => { b.disabled = true; await acao(); b.disabled = false; };
  return b;
}

async function registrar(p, dados) {
  try {
    await acrescentar("balcao", { tipo: "status", ...dados, refId: p.id, data: p.data, hora: agora(),
      registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() });
  } catch { alert("Não consegui salvar. Verifique a internet e tente de novo."); }
  await mostrar();
}

function imprimir(p) {
  document.getElementById("impressao").innerHTML = `<div class="cupom">
    <h1>MADALENA'S</h1><p class="centro">PEDIDO DO BALCÃO</p><hr>
    <p class="numero">#${p.numero}</p>
    <p class="grande">${esc(ondeTexto(p.onde).toUpperCase())}</p>
    ${p.cliente ? `<p class="centro">${esc(p.cliente)}</p>` : ""}<hr>
    <div class="pedido">${itensEmHtml(p)}</div>
    ${p.obs ? `<p>Obs: ${esc(p.obs)}</p>` : ""}<hr>
    <p>${p.pago ? "PAGO" : "Paga no fim"}</p>
    <p>Pedido às ${esc(p.hora)} · ${dataBR(p.data)} · por ${esc(p.registradoPor)}</p>
  </div>`;
  window.print();
}

/* ---------- Novo pedido ---------- */
const fundo = document.getElementById("fundo");
const folha = document.getElementById("folha");
fundo.onclick = (ev) => { if (ev.target === fundo) fundo.hidden = true; };

function abrirFolha() {
  let onde = null, pago = null;
  folha.innerHTML = `
    <h2>Novo pedido</h2>
    <label class="rot">Onde o cliente está</label>
    <div class="opcoes" id="f-onde">${MESAS.map((m) => `<button type="button" data-v="${m}" aria-pressed="false">${/^\d+$/.test(m) ? `Mesa ${m}` : m}</button>`).join("")}</div>
    <label class="rot" for="f-cliente">Nome do cliente (opcional)</label>
    <input id="f-cliente" placeholder="Para chamar quando ficar pronto" autocomplete="off">
    <label class="rot">O que pediu (um item por linha)</label>
    <div id="f-itens"></div>
    <input id="f-obs" placeholder="Observação (sem cebola, alergia, ponto da carne…)">
    <label class="rot">Já pagou?</label>
    <div class="opcoes duas" id="f-pago"><button type="button" data-v="sim" aria-pressed="false">Já pagou</button><button type="button" data-v="nao" aria-pressed="false">Paga no fim</button></div>
    <p class="erro" id="f-erro"></p>
    <button class="botao principal" id="f-salvar">Salvar e imprimir comanda</button>
    <button class="botao" id="f-so-salvar" style="text-align:center">Só salvar (sem imprimir)</button>
    <button class="botao" id="f-cancelar" style="text-align:center;border:none">Cancelar</button>`;
  const campo = campoItens([], "Ex.: pão na chapa");
  folha.querySelector("#f-itens").append(campo.el);
  const escolher = (id, set) => folha.querySelector(id).onclick = (ev) => {
    const v = ev.target.closest("button")?.dataset.v; if (!v) return;
    set(v); ev.currentTarget.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v));
  };
  escolher("#f-onde", (v) => (onde = v));
  escolher("#f-pago", (v) => (pago = v));
  folha.querySelector("#f-cancelar").onclick = () => { fundo.hidden = true; };
  const salvar = async (ev, imprimirDepois) => {
    const erro = folha.querySelector("#f-erro");
    const itens = campo.ler();
    if (!onde) return (erro.textContent = "Escolha a mesa (ou Balcão / Viagem).");
    if (!itens.length) return (erro.textContent = "Escreva pelo menos um item.");
    if (!pago) return (erro.textContent = "Marque se já pagou.");
    ev.target.disabled = true;
    const d = hoje();
    try {
      const id = await acrescentar("balcao", { tipo: "pedido", data: d, mes: d.slice(0, 7), hora: agora(), onde,
        cliente: folha.querySelector("#f-cliente").value.trim(), itens, pedido: itensEmTexto(itens),
        obs: folha.querySelector("#f-obs").value.trim(), pago: pago === "sim",
        registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() });
      fundo.hidden = true;
      await mostrar();
      if (imprimirDepois) {
        const p = montar(await listar("balcao", "data", d)).find((x) => x.id === id);
        if (p) imprimir(p);
      }
    } catch {
      erro.textContent = "Não consegui salvar. Verifique a internet e tente de novo.";
      ev.target.disabled = false;
    }
  };
  folha.querySelector("#f-salvar").onclick = (ev) => salvar(ev, true);
  folha.querySelector("#f-so-salvar").onclick = (ev) => salvar(ev, false);
  fundo.hidden = false;
}
document.getElementById("novo").onclick = abrirFolha;
if (leitura) document.getElementById("novo").hidden = true;
mostrar();
setInterval(() => { if (fundo.hidden && document.visibilityState === "visible") mostrar(); }, 30000); // outra pessoa pode ter lançado
</script>
</body>
</html>
