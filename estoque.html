<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  [hidden] { display:none !important; }
  .abas { display:flex; gap:6px; }
  .abas button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--linha); background:var(--cartao); font-size:15px; cursor:pointer; }
  .abas button[aria-pressed="true"] { background:var(--marca); color:#fff; border-color:var(--marca); }
  .mov { background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:12px 14px; display:flex; gap:10px; }
  .mov.cancelada { opacity:.5; }
  .mov.cancelada .prod { text-decoration:line-through; }
  .mov img { width:72px; height:72px; object-fit:cover; border-radius:8px; border:1px solid var(--linha); cursor:zoom-in; background:#eee; flex-shrink:0; }
  .mov .info { display:flex; flex-direction:column; gap:3px; flex:1; font-size:14px; }
  .mov .prod { font-size:17px; font-weight:700; }
  .mov button { align-self:flex-start; font-size:13px; padding:4px 10px; border-radius:8px; border:1px solid var(--linha); background:#fff; color:var(--suave); cursor:pointer; }
  .fundo-folha { position:fixed; inset:0; background:#0006; display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .folha { background:var(--cartao); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; max-height:92vh; overflow-y:auto; }
  .folha h2 { margin:0; font-size:19px; }
  .folha label.rot { font-size:14px; color:var(--suave); margin-bottom:-4px; }
  .folha input[type=text], .folha input[inputmode] { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; box-sizing:border-box; }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opcoes { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .opcoes.tres { grid-template-columns:1fr 1fr 1fr; }
  .opcoes button { padding:11px 6px; border-radius:10px; border:1px solid var(--linha); background:#fff; font-size:14px; cursor:pointer; }
  .opcoes button[aria-pressed="true"] { background:var(--laranja); color:#fff; border-color:var(--laranja); font-weight:600; }
  .camera { display:flex; align-items:center; gap:10px; border:1px dashed var(--linha); border-radius:10px; padding:10px; cursor:pointer; font-size:15px; }
  .camera input { display:none; }
  .camera img { width:64px; height:64px; object-fit:cover; border-radius:8px; }
  .msg-erro { color:var(--alerta); font-size:14px; margin:0; min-height:1em; }
  table.mes { width:100%; border-collapse:collapse; font-size:14px; }
  table.mes th, table.mes td { text-align:left; padding:7px 4px; border-bottom:1px solid var(--linha); }
  table.mes .n { text-align:right; white-space:nowrap; }
  .zoom { position:fixed; inset:0; background:#000d; z-index:20; display:flex; align-items:center; justify-content:center; padding:10px; }
  .zoom img { max-width:100%; max-height:100%; }
  .abas.quatro { flex-wrap:wrap; }
  .abas.quatro button { flex:1 1 40%; }
  .ins { background:var(--cartao); border:1px solid var(--linha); border-left:4px solid var(--ok); border-radius:12px; padding:10px 14px; display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:15px; }
  .ins.baixo { border-left-color:var(--alerta); background:#fff5f4; }
  .ins .q { font-weight:700; white-space:nowrap; text-align:right; }
  .acoes-est { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .acoes-est button { padding:14px 8px; border-radius:12px; border:1px solid var(--linha); background:var(--cartao); font-size:15px; cursor:pointer; text-align:left; }
  .acoes-est button b { display:block; font-size:16px; margin-bottom:2px; }
  .cont { display:grid; grid-template-columns:1fr 90px; gap:6px; align-items:center; font-size:15px; padding:4px 0; border-bottom:1px solid var(--linha); }
  .cont input { font-size:16px; padding:8px; border:1px solid var(--linha); border-radius:8px; width:100%; box-sizing:border-box; }
  select.sel { font-size:17px; padding:10px; border:1px solid var(--linha); border-radius:10px; background:#fff; width:100%; }
  .cad { display:grid; grid-template-columns:1fr 92px 64px 26px; gap:4px; align-items:center; }
  .cad input { font-size:14px; padding:7px 5px; border:1px solid var(--linha); border-radius:8px; width:100%; box-sizing:border-box; }
  .cad button { border:none; background:none; font-size:18px; color:var(--suave); cursor:pointer; }
</style>
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Estoque</h1><a href="turno.html">Voltar</a></header>
<main>
  <div class="abas quatro" id="abas">
    <button aria-pressed="true" data-aba="saldo">Saldo</button>
    <button aria-pressed="false" data-aba="mov">Registrar</button>
    <button aria-pressed="false" data-aba="hist">Histórico</button>
    <button aria-pressed="false" data-aba="custo" id="aba-custo" hidden>Custos</button>
    <button aria-pressed="false" data-aba="cad" id="aba-cad" hidden>Insumos</button>
  </div>
  <section id="sec"></section>
</main>
<div class="fundo-folha" id="fundo" hidden><div class="folha" id="folha"></div></div>
<div class="zoom" id="zoom" hidden><img alt="Foto"></div>

<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, hoje, dataBR } from "./js/sessao.js";
import { pode } from "./js/equipe.js";
import { acrescentar, listarEntre, ler, salvarComHistorico } from "./js/db.js";
import { INSUMOS_PADRAO, LOCAIS, UNIDADES, carregarListaInsumos, criarInsumo } from "./js/insumos.js";

const eu = await exigirUsuario();
const lanca = !pode.somenteLeitura(eu);          // o Fábio só vê
const podeCancelar = pode.registrarNoLivro(eu);  // dona e líderes
const veCusto = pode.verPainel(eu);              // Daiane e Fábio
const cadastra = eu.papel === "dona";
if (veCusto) document.getElementById("aba-custo").hidden = false;
if (cadastra) document.getElementById("aba-cad").hidden = false;
const sec = document.getElementById("sec");
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const numero = (t) => { t = String(t ?? "").trim(); return Number(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t); };
const n = (v) => String(Math.round(v * 1000) / 1000).replace(".", ",");
const reais = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const agora = () => new Date().toTimeString().slice(0, 5);
const localPadrao = eu.setor === "Confeitaria" ? "Confeitaria" : "Panificadora";
const ACOES = {
  entrada:       { nome: "📷 Chegou compra", desc: "Tire a foto da nota: o sistema preenche e você confere", sinal: 1 },
  saida:         { nome: "Tirei do estoque", desc: "Para usar na produção ou para levar à outra unidade", sinal: 0, menu: true },
  uso:           { nome: "Usado na produção", desc: "", sinal: -1, escondido: true },
  transferencia: { nome: "Levado para a outra unidade", desc: "", sinal: 0, escondido: true },
  perda:         { nome: "Perdi / estragou", desc: "Só insumo (farinha, ovo, leite...). Bolo, pão ou salgado pronto vai em Perdas e sobras", sinal: -1 },
  contagem:      { nome: "Contagem", desc: "Contar o que tem de verdade na prateleira", sinal: 0 },
};

function reduzir(arquivo, ladoMax = 1400, limite = 500000) {
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      let lado = ladoMax, qualidade = 0.7, url;
      do {
        const escala = Math.min(1, lado / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL("image/jpeg", qualidade);
        lado -= 200; qualidade -= 0.05;
      } while (url.length > limite && lado > 400);
      URL.revokeObjectURL(img.src);
      ok(url);
    };
    img.onerror = falha;
    img.src = URL.createObjectURL(arquivo);
  });
}
document.getElementById("zoom").onclick = (e) => { e.currentTarget.hidden = true; };

/* ---------- Dados ---------- */
let INSUMOS = INSUMOS_PADRAO;
async function carregarInsumos() { INSUMOS = await carregarListaInsumos(); }
// "+ Item novo": qualquer pessoa cria um insumo que ainda não está na lista. Devolve o item (ou null se desistiu).
function pedirItemNovo(nomeInicial = "") {
  return new Promise((ok) => {
    const caixa = document.createElement("div");
    caixa.style.cssText = "position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px";
    caixa.innerHTML = `<div class="cartao" style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0">Item novo no estoque</h2>
      <label class="rot">Nome</label><input id="n-nome" value="${esc(nomeInicial)}" placeholder="Ex.: Farinha de trigo Dona Benta" style="font-size:17px;padding:10px;border:1px solid var(--linha);border-radius:10px">
      <label class="rot">Conta em</label><input id="n-un" list="n-uns" placeholder="kg, unidade, saco 25 kg…" style="font-size:17px;padding:10px;border:1px solid var(--linha);border-radius:10px">
      <datalist id="n-uns">${UNIDADES.map((u) => `<option value="${esc(u)}">`).join("")}</datalist>
      <p class="msg-erro" id="n-e"></p>
      <button class="botao principal" id="n-ok">Criar item</button><button class="botao" id="n-x" style="border:none;text-align:center">Cancelar</button></div>`;
    document.body.append(caixa);
    caixa.querySelector(nomeInicial ? "#n-un" : "#n-nome").focus();
    caixa.querySelector("#n-x").onclick = () => { caixa.remove(); ok(null); };
    caixa.querySelector("#n-ok").onclick = async (e) => {
      const nome = caixa.querySelector("#n-nome").value.trim(), un = caixa.querySelector("#n-un").value.trim();
      if (!nome || !un) return (caixa.querySelector("#n-e").textContent = "Preencha o nome e em que se conta.");
      const igual = INSUMOS.find((i) => i.nome.toLowerCase() === nome.toLowerCase());
      if (igual) { caixa.remove(); return ok(igual); }
      e.target.disabled = true;
      try { const item = await criarInsumo(nome, un, eu); INSUMOS.push(item); caixa.remove(); ok(item); }
      catch { caixa.querySelector("#n-e").textContent = "Não consegui criar. Verifique a internet."; e.target.disabled = false; }
    };
  });
}
const ins = (id) => INSUMOS.find((i) => i.id === id) || { id, nome: id, unidade: "", minimo: 0 };
// Código de barras: o sistema aprende. Na primeira vez a pessoa escolhe o insumo; depois o código já acha sozinho.
let CODIGOS = {};
async function carregarCodigos() {
  CODIGOS = {};
  for (const m of await movimentos()) if (m.codigo && !m.cancelamento) CODIGOS[m.codigo] = m.insumoId;
}
const campoCodigo = (id) => `<label class="rot" for="${id}">Código de barras <span class="suave">(passe o leitor ou digite)</span></label>
  <input id="${id}" inputmode="numeric" autocomplete="off" placeholder="▮▯▮▮▯ toque aqui e passe o leitor" style="font-size:17px;padding:10px;border:2px dashed var(--linha);border-radius:10px;width:100%;box-sizing:border-box">
  <p class="suave" id="${id}-msg" style="margin:0;font-size:13px"></p>`;
// Leitores de código funcionam como teclado: digitam o número e apertam Enter.
function ligaCodigo(id, achou) {
  const c = folha.querySelector("#" + id);
  const ler = () => { const v = c.value.trim(); if (!v) return; const i = CODIGOS[v]; achou(v, i); };
  c.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); ler(); } };
  c.onchange = ler;
}
async function movimentos() {
  const regs = (await listarEntre("estoque", "data", "2000-01-01", "9999-12-31")).sort((a, b) => a.criadoEm.localeCompare(b.criadoEm));
  const canc = Object.fromEntries(regs.filter((r) => r.tipo === "cancelamento").map((r) => [r.refId, r]));
  return regs.filter((r) => r.tipo === "mov").map((r) => ({ ...r, cancelamento: canc[r.id] }));
}
// Saldo por insumo e local: a última contagem vale como ponto de partida; depois soma entradas e tira saídas.
function saldos(movs) {
  const s = {};
  const k = (id, l) => `${id}|${l}`;
  for (const m of movs.filter((m) => !m.cancelamento)) {
    if (m.acao === "contagem") s[k(m.insumoId, m.local)] = m.qtd;
    else if (m.acao === "transferencia") { s[k(m.insumoId, m.de)] = (s[k(m.insumoId, m.de)] || 0) - m.qtd; s[k(m.insumoId, m.para)] = (s[k(m.insumoId, m.para)] || 0) + m.qtd; }
    else s[k(m.insumoId, m.local)] = (s[k(m.insumoId, m.local)] || 0) + ACOES[m.acao].sinal * m.qtd;
  }
  const contados = new Set(movs.filter((m) => !m.cancelamento && m.acao === "contagem").map((m) => m.insumoId));
  const f = (id, l) => (l ? s[k(id, l)] || 0 : LOCAIS.reduce((t, x) => t + (s[k(id, x)] || 0), 0));
  f.contado = (id) => contados.has(id);
  return f;
}
// Custo: média ponderada das compras dos últimos 90 dias (ou o último preço).
function custos(movs) {
  const lim = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
  const c = {};
  for (const m of movs.filter((m) => !m.cancelamento && m.acao === "entrada" && m.preco > 0)) {
    const x = (c[m.insumoId] ||= { qtd: 0, total: 0, ultimo: 0, ultimaData: "" });
    if (m.data >= lim) { x.qtd += m.qtd; x.total += m.qtd * m.preco; }
    x.ultimo = m.preco; x.ultimaData = m.data;
  }
  return (id) => { const x = c[id]; if (!x) return null; return { medio: x.qtd ? x.total / x.qtd : x.ultimo, ultimo: x.ultimo, ultimaData: x.ultimaData }; };
}

/* ---------- Saldo ---------- */
async function abaSaldo() {
  const sal = saldos(await movimentos());
  const baixo = (i) => sal.contado(i.id) && i.minimo > 0 && sal(i.id) < i.minimo;
  const baixos = INSUMOS.filter(baixo);
  const nunca = INSUMOS.filter((i) => !sal.contado(i.id)).length;
  sec.innerHTML = `<div class="cartao"><p style="margin:0">${baixos.length ? `<span class="selo alerta" style="margin-left:0">${baixos.length} abaixo do mínimo</span>` : `<span class="selo ok" style="margin-left:0">Nada abaixo do mínimo</span>`}</p>
      <p class="suave" style="margin:6px 0 0;font-size:13px">O saldo parte da última contagem.${nunca ? ` <b>${nunca} insumo(s) nunca foram contados</b>: conte (Registrar → Contagem) para o saldo valer.` : ""}</p></div>
    <div id="lis" style="display:flex;flex-direction:column;gap:6px"></div>`;
  const lis = sec.querySelector("#lis");
  for (const i of [...INSUMOS].sort((a, b) => (baixo(a) ? 0 : sal.contado(a.id) ? 1 : 2) - (baixo(b) ? 0 : sal.contado(b.id) ? 1 : 2) || a.nome.localeCompare(b.nome))) {
    const d = document.createElement("div");
    d.className = "ins" + (baixo(i) ? " baixo" : "");
    if (!sal.contado(i.id)) d.style.borderLeftColor = "var(--linha)";
    d.innerHTML = `<span><b>${esc(i.nome)}</b><br><span class="suave" style="font-size:12px">${LOCAIS.map((l) => `${l}: ${n(sal(i.id, l))}`).join(" · ")} · mínimo ${n(i.minimo)}</span></span>
      <span class="q">${sal.contado(i.id) ? n(sal(i.id)) : `<span class="suave" style="font-weight:400">não contado</span>`}<br><span class="suave" style="font-size:12px;font-weight:400">${esc(i.unidade)}</span></span>`;
    lis.append(d);
  }
}

/* ---------- Registrar ---------- */
function abaMov() {
  if (!lanca) { sec.innerHTML = `<p class="suave">Você só acompanha o estoque.</p>`; return; }
  sec.innerHTML = `<div class="acoes-est">${Object.entries(ACOES).filter(([, a]) => !a.escondido).map(([k, a]) => `<button data-a="${k}"><b>${a.nome}</b><span class="suave">${a.desc}</span></button>`).join("")}</div>`;
  // "Chegou compra" começa pela foto da nota (uma foto só); dá para preencher à mão se a leitura não der certo.
  sec.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => (b.dataset.a === "contagem" ? contagem() : b.dataset.a === "entrada" ? lerNota() : formulario(b.dataset.a))));
}
const fundo = document.getElementById("fundo");
const folha = document.getElementById("folha");
fundo.onclick = (e) => { if (e.target === fundo) fundo.hidden = true; };
const grupo = (id, lista, sel) => `<div class="opcoes" id="${id}">${lista.map((x) => `<button type="button" data-v="${esc(x)}" aria-pressed="${x === sel}">${esc(x)}</button>`).join("")}</div>`;
const ligaGrupo = (id, fn) => { const g = folha.querySelector(id); g.onclick = (e) => { const v = e.target.closest("button")?.dataset.v; if (!v) return; g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === v)); fn(v); }; };
const selInsumo = () => `<select id="m-ins" class="sel"><option value="">${INSUMOS.length ? "Escolha o insumo" : "Nenhum item ainda: toque em + Item novo"}</option>${[...INSUMOS].sort((a, b) => a.nome.localeCompare(b.nome)).map((i) => `<option value="${esc(i.id)}">${esc(i.nome)} (${esc(i.unidade)})</option>`).join("")}<option value="__novo">+ Item novo (não está na lista)</option></select>`;

function formulario(acao, fotoPronta = null) {
  const a = ACOES[acao];
  const sel = { local: localPadrao, de: localPadrao, para: LOCAIS.find((l) => l !== localPadrao), praQue: null };
  let urlFoto = fotoPronta;
  folha.innerHTML = `<h2>${a.nome}</h2>
    ${campoCodigo("m-cod")}
    <label class="rot">Insumo</label>${selInsumo()}
    <label class="rot" for="m-q">Quantidade <span id="m-un"></span></label><input id="m-q" inputmode="decimal" placeholder="0">
    ${acao === "saida" ? `<label class="rot">Para quê?</label>${grupo("m-praque", ["Usar na produção", "Levar para a outra unidade"], null)}<label class="rot">De qual unidade saiu</label>${grupo("m-local", LOCAIS, sel.local)}<p class="suave" id="m-destino" style="margin:0;font-size:14px"></p>`
      : acao === "transferencia" ? `<label class="rot">De</label>${grupo("m-de", LOCAIS, sel.de)}<label class="rot">Para</label>${grupo("m-para", LOCAIS, sel.para)}` : `<label class="rot">Onde</label>${grupo("m-local", LOCAIS, sel.local)}`}
    ${acao === "entrada" ? `<label class="rot" for="m-p">Preço de cada <span class="m-un2"></span> (R$)</label><input id="m-p" inputmode="decimal" placeholder="0,00">
      <p id="m-tot" class="suave" style="margin:0"></p>
      <label class="rot" for="m-f">Fornecedor</label><input type="text" id="m-f" autocomplete="off" placeholder="Ex.: Atacadão, Priori, distribuidor do ovo">
      <label class="camera" id="m-cam">${fotoPronta ? `<img src="${fotoPronta}" alt="Nota"><span>Foto da nota pronta. Toque para trocar.</span>` : `📷 <span>Foto da nota fiscal (obrigatória)</span>`}<input type="file" accept="image/*" capture="environment"></label>` : ""}
    <input type="text" id="m-o" placeholder="${acao === "perda" ? "O que aconteceu (obrigatório)" : "Observação (opcional)"}" autocomplete="off">
    <p class="msg-erro" id="m-e"></p>
    <button class="botao principal" id="m-ok">Salvar</button>
    <button class="botao" id="m-x" style="text-align:center;border:none">Cancelar</button>`;
  const insSel = folha.querySelector("#m-ins");
  insSel.onchange = async () => {
    if (insSel.value === "__novo") {
      const item = await pedirItemNovo();
      insSel.innerHTML = selInsumo().replace(/^<select[^>]*>|<\/select>$/g, "");
      insSel.value = item ? item.id : "";
    }
    const u = insSel.value ? ins(insSel.value).unidade : ""; folha.querySelector("#m-un").textContent = u ? `(${u})` : ""; folha.querySelectorAll(".m-un2").forEach((e) => (e.textContent = u)); };
  let codigo = null;
  ligaCodigo("m-cod", (v, id) => {
    codigo = v;
    const msg = folha.querySelector("#m-cod-msg");
    if (id) { insSel.value = id; insSel.onchange(); msg.innerHTML = `<span class="ok">✓ ${esc(ins(id).nome)}</span>`; folha.querySelector("#m-q").focus(); }
    else { msg.innerHTML = `<b>Código novo.</b> Escolha o insumo na lista abaixo: da próxima vez ele já aparece sozinho.`; insSel.focus(); }
  });
  const destino = () => { const d = folha.querySelector("#m-destino"); if (d) d.textContent = sel.praQue === "Levar para a outra unidade" ? `Vai para: ${LOCAIS.find((l) => l !== sel.local)}` : ""; };

  if (acao === "saida") ligaGrupo("#m-praque", (v) => { sel.praQue = v; destino(); });

    const tot = () => { const q = numero(folha.querySelector("#m-q").value), p = numero(folha.querySelector("#m-p").value); folha.querySelector("#m-tot").textContent = q > 0 && p > 0 ? `Total: ${reais(q * p)}` : ""; };
    folha.querySelector("#m-q").oninput = tot; folha.querySelector("#m-p").oninput = tot;
    const cam = folha.querySelector("#m-cam");
    cam.querySelector("input").onchange = async function trocar(e) {

      cam.querySelector("span").textContent = "Preparando a foto…";

      catch { cam.querySelector("span").textContent = "Não consegui ler a foto. Tente de novo."; }
    };
  }
  folha.querySelector("#m-x").onclick = () => { fundo.hidden = true; };
  folha.querySelector("#m-ok").onclick = async (e) => {

    if (acao === "saida" && !sel.praQue) return (erro.textContent = "Diga para quê: usar na produção ou levar para a outra unidade.");
    if (acao === "saida") { acao = sel.praQue === "Usar na produção" ? "uso" : "transferencia"; if (acao === "transferencia") { sel.de = sel.local; sel.para = LOCAIS.find((l) => l !== sel.local); } }
    if (!(qtd > 0)) return (erro.textContent = "Coloque a quantidade.");
    if (acao === "transferencia" && sel.de === sel.para) return (erro.textContent = "De e Para não podem ser o mesmo lugar.");
    let preco = null, fornecedor = null;
    if (acao === "entrada") {
      preco = numero(folha.querySelector("#m-p").value); fornecedor = folha.querySelector("#m-f").value.trim();
      if (!(preco > 0)) return (erro.textContent = "Coloque o preço de cada unidade.");
      if (!fornecedor) return (erro.textContent = "Escreva o fornecedor.");
      if (!urlFoto) return (erro.textContent = "Tire a foto da nota fiscal.");
    }
    if (acao === "perda" && !obs) return (erro.textContent = "Explique o que aconteceu.");
    e.target.disabled = true;
    try {
      const d = hoje();
      const base = { data: d, mes: d.slice(0, 7), hora: agora(), registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() };
      const fotoId = urlFoto ? await acrescentar("estoque_fotos", { ...base, foto: urlFoto }) : null;
      await acrescentar("estoque", { ...base, tipo: "mov", acao, insumoId, nome: ins(insumoId).nome, unidade: ins(insumoId).unidade, qtd,
        local: acao === "transferencia" ? null : sel.local, de: acao === "transferencia" ? sel.de : null, para: acao === "transferencia" ? sel.para : null,
        preco: preco ? Math.round(preco * 100) / 100 : null, fornecedor, obs, fotoId, codigo: codigo || null });
      if (codigo) CODIGOS[codigo] = insumoId;
      fundo.hidden = true; ir("hist");
    } catch { erro.textContent = "Não consegui salvar. Verifique a internet e tente de novo."; e.target.disabled = false; }
  };
  fundo.hidden = false;
}

// Ler a nota pela foto (teste): lê o texto no celular, separa os itens e a pessoa confere tudo antes de salvar.

// Mostra os segundos passando enquanto a IA trabalha (para ninguém achar que travou).
function relogio(el, texto) { const t0 = Date.now(); el.textContent = `${texto} 0s`; const id = setInterval(() => (el.textContent = `${texto} ${Math.round((Date.now() - t0) / 1000)}s`), 1000); return () => clearInterval(id); }
const motivoIA = (ia, err) => `(${ia.etapa ? `parou em: ${ia.etapa}; ` : ""}${String(err?.message || err).slice(0, 80)})`;

async function contagem() {
  const sal = saldos(await movimentos());
  let local = localPadrao;
  const desenhar = () => {
    folha.innerHTML = `<h2>Contagem</h2><p class="suave" style="margin:0">Conte o que tem de verdade na prateleira. Deixe em branco o que não contou.</p>

      ${campoCodigo("c-cod")}
      <label class="camera" id="c-cam" style="padding:12px">📷 <span>Contar pela foto da prateleira (o sistema sugere, você confere)</span><input type="file" accept="image/*" capture="environment"></label>
      <p id="c-ia" class="suave" style="margin:0;font-size:13px"></p>
      ${INSUMOS.length ? "" : `<p class="suave">Ainda não tem nenhum item no estoque. Toque em + Item novo para começar.</p>`}
      <div>${[...INSUMOS].sort((a, b) => a.nome.localeCompare(b.nome)).map((i) => `<div class="cont"><span>${esc(i.nome)} <span class="suave" style="font-size:12px">(${esc(i.unidade)})</span></span><input inputmode="decimal" data-c="${esc(i.id)}"></div><div class="suave" data-obs="${esc(i.id)}" style="font-size:12px;margin:-4px 0 6px" hidden></div>`).join("")}</div>
      <button class="botao" id="c-novo" style="text-align:center">+ Item novo (não está na lista)</button>
      <p class="msg-erro" id="c-e"></p>

    ligaGrupo("#c-l", (v) => { local = v; });
    folha.querySelector("#c-novo").onclick = async () => {
      const valores = Object.fromEntries([...folha.querySelectorAll("[data-c]")].map((i) => [i.dataset.c, i.value]));
      const item = await pedirItemNovo(); if (!item) return;
      desenhar();
      for (const [id, v] of Object.entries(valores)) { const c = folha.querySelector(`[data-c="${id}"]`); if (c) c.value = v; }
      folha.querySelector(`[data-c="${item.id}"]`)?.focus();
    };
    ligaCodigo("c-cod", (v, id) => {
      const msg = folha.querySelector("#c-cod-msg"), c = folha.querySelector("#c-cod");
      if (!id) { msg.innerHTML = "<b>Código novo.</b> Conte pela lista; registre uma compra ou uso com esse código para ele ser reconhecido."; c.select(); return; }
      const campo = folha.querySelector(`[data-c="${id}"]`);
      msg.innerHTML = `<span class="ok">✓ ${esc(ins(id).nome)}</span>`; c.value = "";
      campo.scrollIntoView({ block: "center" }); campo.focus();
    });
    folha.querySelector("#c-cam input").onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return; e.target.value = "";
      const msg = folha.querySelector("#c-ia");
      const ia = await import("./js/ia.js");
      if (!ia.iaDisponivel) return (msg.textContent = "A contagem pela foto só funciona no sistema de verdade (com a inteligência do Google ligada).");
      const parar = relogio(msg, "Olhando a foto (até 1 minuto e meio, não feche a tela)…");
      try {
        const achados = await ia.contarFotoIA(await reduzir(f, 1600, 1500000), INSUMOS).finally(parar);
        if (!achados.length) return (msg.textContent = "Não reconheci nenhum insumo da lista nesta foto. Tente mais perto e com mais luz.");
        for (const a of achados) {
          const campo = folha.querySelector(`[data-c="${a.insumoId}"]`), ob = folha.querySelector(`[data-obs="${a.insumoId}"]`);
          if (!campo) continue;
          const atual = campo.value.trim() === "" ? 0 : numero(campo.value) || 0;
          campo.value = n(atual + a.qtd); campo.style.background = "#fff6d6";
          ob.hidden = false; ob.textContent = `📷 sugerido pela foto${atual ? " (somado)" : ""}: ${a.obs || n(a.qtd)}. Confira!`;
        }
        msg.innerHTML = `Preenchi <b>${achados.length}</b> item(ns) em amarelo. <b>Confira e corrija</b>: a foto não mostra o que está atrás. Pode tirar outra foto de outra prateleira que eu somo.`;
      } catch (err) { console.error(err); parar(); msg.textContent = `A contagem pela foto não funcionou agora ${motivoIA(ia, err)}. Pode contar pela lista abaixo normalmente.`; }
    };
    folha.querySelector("#c-x").onclick = () => { fundo.hidden = true; };
    folha.querySelector("#c-ok").onclick = async (e) => {
      const itens = [...folha.querySelectorAll("[data-c]")].filter((i) => i.value.trim() !== "");
      if (!itens.length) return (folha.querySelector("#c-e").textContent = "Conte pelo menos um insumo.");
      const ruim = itens.find((i) => !(numero(i.value) >= 0));
      if (ruim) return (folha.querySelector("#c-e").textContent = `Número inválido em ${ins(ruim.dataset.c).nome}.`);
      e.target.disabled = true;
      try {
        const d = hoje();
        for (const i of itens) {
          const id = i.dataset.c, qtd = numero(i.value), antes = sal(id, local);
          await acrescentar("estoque", { tipo: "mov", acao: "contagem", insumoId: id, nome: ins(id).nome, unidade: ins(id).unidade, qtd, local,
            esperado: Math.round(antes * 1000) / 1000, diferenca: Math.round((qtd - antes) * 1000) / 1000,
            data: d, mes: d.slice(0, 7), hora: agora(), registradoPor: eu.nome, registradoPorUid: eu.uid, criadoEm: new Date().toISOString() });
        }
        fundo.hidden = true; ir("hist");
      } catch { folha.querySelector("#c-e").textContent = "Não consegui salvar tudo. Verifique a internet."; e.target.disabled = false; }
    };
  };
  desenhar();
  fundo.hidden = false;
}

        ${m.obs ? `<span class="suave">${esc(m.obs)}</span>` : ""}

        ${m.cancelamento ? `<span class="suave">Cancelado por ${esc(m.cancelamento.registradoPor)}: ${esc(m.cancelamento.motivo)}</span>` : ""}</div>`;

/* ---------- Custos (Daiane e Fábio) ---------- */
async function abaCusto() {
  const movs = await movimentos();
  const cu = custos(movs);
  const mes = hoje().slice(0, 7);
  const compras = movs.filter((m) => !m.cancelamento && m.acao === "entrada" && m.mes === mes);
  const porForn = {};
  for (const m of compras) porForn[m.fornecedor] = (porForn[m.fornecedor] || 0) + m.qtd * m.preco;
  const perdas = movs.filter((m) => !m.cancelamento && m.acao === "perda" && m.mes === mes);
  const difs = movs.filter((m) => !m.cancelamento && m.acao === "contagem" && m.mes === mes && m.diferenca < 0);
  const valor = (m, q) => (cu(m.insumoId)?.medio || 0) * q;
  sec.innerHTML = `<div class="cartao"><h2 style="margin:0 0 6px">Compras deste mês: ${reais(compras.reduce((s, m) => s + m.qtd * m.preco, 0))}</h2>
      <table class="mes">${Object.entries(porForn).sort((a, b) => b[1] - a[1]).map(([f, v]) => `<tr><td>${esc(f)}</td><td class="n">${reais(v)}</td></tr>`).join("") || `<tr><td class="suave">Nenhuma compra registrada.</td></tr>`}</table>
      <h3 style="margin:14px 0 4px;font-size:15px">Perdido no estoque este mês: ${reais(perdas.reduce((s, m) => s + valor(m, m.qtd), 0))}</h3>
      <h3 style="margin:8px 0 4px;font-size:15px;color:var(--alerta)">Sumiu na contagem este mês: ${reais(difs.reduce((s, m) => s + valor(m, -m.diferenca), 0))}</h3>
      ${difs.length ? `<table class="mes">${difs.map((m) => `<tr><td>${dataBR(m.data).slice(0, 5)} · ${esc(m.nome)} (${esc(m.local)})</td><td class="n">${n(m.diferenca)} ${esc(m.unidade)}</td></tr>`).join("")}</table>` : ""}</div>
    <div class="cartao"><h2 style="margin:0 0 6px">Custo de cada insumo</h2><p class="suave" style="margin:0 0 6px;font-size:13px">Média das compras dos últimos 90 dias. Vai servir para calcular o custo das fichas técnicas.</p>
      <table class="mes"><tr><th>Insumo</th><th class="n">Médio</th><th class="n">Último</th></tr>${[...INSUMOS].sort((a, b) => a.nome.localeCompare(b.nome)).map((i) => { const c = cu(i.id);
        return `<tr><td>${esc(i.nome)} <span class="suave">(${esc(i.unidade)})</span></td><td class="n">${c ? reais(c.medio) : "—"}</td><td class="n">${c ? `${reais(c.ultimo)}<br><span class="suave" style="font-size:11px">${dataBR(c.ultimaData)}</span>` : "—"}</td></tr>`; }).join("")}</table></div>`;
}

/* ---------- Insumos (só a Daiane) ---------- */
let removidosAntes = [];
function abaCad() {
  ler("estoque_cadastro", "insumos").then((c) => { removidosAntes = c?.versao >= 2 ? c.removidos || [] : []; }).catch(() => {});
  let lista = INSUMOS.map((i) => ({ ...i }));
  const desenhar = () => {
    sec.innerHTML = `<div class="cartao"><p class="suave" style="margin:0 0 8px;font-size:13px">Nome, unidade em que se conta (kg, saco 25 kg, cartela...) e o mínimo que precisa ter. Abaixo do mínimo, aparece em vermelho no seu Painel.</p>
      <div style="display:flex;flex-direction:column;gap:5px">${lista.map((i, k) => `<div class="cad" data-k="${k}"><input value="${esc(i.nome)}" data-f="nome" placeholder="Nome"><input value="${esc(i.unidade)}" data-f="unidade" placeholder="Unidade"><input value="${esc(n(i.minimo))}" data-f="minimo" inputmode="decimal" placeholder="Mín."><button data-tira="${k}" aria-label="Tirar">×</button></div>`).join("")}</div>
      <button class="mais" id="i-mais" style="margin-top:8px;width:100%;border:1px dashed var(--linha);background:#fff;border-radius:10px;padding:10px">+ Novo insumo</button>
      <p class="msg-erro" id="i-e"></p><button class="botao principal" id="i-ok" style="text-align:center;width:100%">Salvar lista</button></div>`;
    sec.querySelectorAll(".cad").forEach((r) => r.querySelectorAll("input").forEach((inp) => (inp.oninput = () => { lista[r.dataset.k][inp.dataset.f] = inp.dataset.f === "minimo" ? inp.value : inp.value; })));
    sec.querySelectorAll("[data-tira]").forEach((b) => (b.onclick = () => { if (confirm(`Tirar ${lista[b.dataset.tira].nome} da lista? O histórico continua guardado.`)) { lista.splice(b.dataset.tira, 1); desenhar(); } }));
    sec.querySelector("#i-mais").onclick = () => { lista.push({ id: "i" + Date.now().toString(36), nome: "", unidade: "kg", minimo: 0 }); desenhar(); sec.querySelector(".cad:last-child input").focus(); };
    sec.querySelector("#i-ok").onclick = async (e) => {
      const limpa = lista.map((i) => ({ id: i.id, nome: String(i.nome).trim(), unidade: String(i.unidade).trim(), minimo: numero(i.minimo) || 0 }));
      if (limpa.some((i) => !i.nome || !i.unidade)) return (sec.querySelector("#i-e").textContent = "Todo insumo precisa de nome e unidade.");
      e.target.disabled = true;
      const removidos = INSUMOS.map((i) => i.id).filter((id) => !limpa.some((i) => i.id === id));
      try { await salvarComHistorico("estoque_cadastro", "insumos", { versao: 2, lista: limpa, removidos: [...new Set([...(removidosAntes || []), ...removidos])], alteradoPor: eu.nome, alteradoPorUid: eu.uid, alteradoEm: new Date().toISOString() }); INSUMOS = limpa; sec.querySelector("#i-e").textContent = ""; alert("Lista salva."); }
      catch { sec.querySelector("#i-e").textContent = "Não consegui salvar."; }
      e.target.disabled = false;
    };
  };
  desenhar();
}

const ABAS = { saldo: abaSaldo, mov: abaMov, hist: abaHist, custo: abaCusto, cad: abaCad };
function ir(aba) { document.querySelectorAll("#abas button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.aba === aba)); ABAS[aba](); }
document.getElementById("abas").onclick = (e) => { const a = e.target.closest("button")?.dataset.aba; if (a) ir(a); };
await carregarInsumos();
await carregarCodigos();
ir(location.hash === "#registrar" && lanca ? "mov" : "saldo");
</script>
