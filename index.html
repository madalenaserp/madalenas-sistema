<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Kaushan+Script&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
<style>
  body { background: radial-gradient(circle at 50% 0%, #4a2c1e 0%, var(--marca) 45%, var(--marca-escura) 100%); min-height:100vh; }
  .capa { display:flex; flex-direction:column; align-items:center; gap:18px; padding:48px 16px 8px; text-align:center; }
  main { padding-top:8px; }
  #login { border:none; border-top:4px solid var(--laranja); box-shadow:0 10px 30px #0005; }
  #login input { padding:12px; font-size:17px; }
  .rodape { color:var(--creme); opacity:.6; font-size:12px; text-align:center; margin-top:8px; }
</style>
</head>
<body>
<div class="capa">
  <div data-logo></div>
  <div data-slogan></div>
</div>
<main>
  <form class="cartao" id="login" hidden style="display:flex;flex-direction:column;gap:10px">
    <h2>Entrar no sistema</h2>
    <input type="text" id="usuario" placeholder="Usuário (ex.: daiane)" autocomplete="off" autocapitalize="none" required>
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required style="font-size:16px;padding:6px 8px;border:1px solid var(--linha);border-radius:8px">
    <p class="suave" id="erro" style="color:var(--alerta);margin:0"></p>
    <button class="botao principal" type="submit">Entrar</button>
  </form>
  <div id="teste" hidden>
    <div class="aviso">Modo teste: escolha um nome. Os dados ficam só neste aparelho.</div>
    <div class="grade" id="nomes" style="margin-top:12px"></div>
  </div>
  <p class="rodape">Madalena's Coffee Shop · uso interno da equipe</p>
</main>
<script type="module" src="js/marca.js"></script>
<script type="module">
import { EQUIPE } from "./js/equipe.js";
import { entrar, usuarioAtual } from "./js/sessao.js";
import { modoTeste } from "./js/firebase.js";

if (await usuarioAtual()) location.href = "turno.html";

if (modoTeste) {
  document.getElementById("teste").hidden = false;
  const caixa = document.getElementById("nomes");
  for (const p of EQUIPE) {
    const b = document.createElement("button");
    b.className = "botao";
    b.innerHTML = `<b>${p.nome}</b><br><span class="suave">${p.setor}</span>`;
    b.onclick = async () => { await entrar(p.nome); location.href = "turno.html"; };
    caixa.append(b);
  }
} else {
  const form = document.getElementById("login");
  form.hidden = false;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const erro = document.getElementById("erro");
    erro.textContent = "";
    try {
      await entrar(document.getElementById("usuario").value, document.getElementById("senha").value);
      if (await usuarioAtual()) location.href = "turno.html";
      else erro.textContent = "Usuário sem cadastro ativo. Fale com a Daiane.";
    } catch {
      erro.textContent = "Usuário ou senha errados.";
    }
  };
}
</script>
</body>
</html>
