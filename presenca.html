<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Presença</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .linha { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; background:var(--cartao); border:1px solid var(--linha); border-radius:12px; padding:14px; font-size:17px; color:var(--tinta); cursor:pointer; text-align:left; }
  .estado { font-size:14px; border-radius:999px; padding:4px 10px; white-space:nowrap; }
  .estado.pendente { background:#eee; color:var(--suave); }
  .estado.ok { background:#e3f2e6; color:var(--ok); }
  .estado.alerta { background:#fbe3e1; color:var(--alerta); }
  .estado.neutro { background:#e8eef7; color:#2c4a7a; }
  .fundo-folha { position:fixed; inset:0; background:#0006; display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .fundo-folha[hidden] { display:none; }
  .folha { background:var(--cartao); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; max-height:90vh; overflow-y:auto; }
  .folha h2 { margin:0 0 4px; font-size:19px; }
  .folha .botao { text-align:center; }
  .folha .botao.verde { background:var(--ok); color:#fff; border-color:var(--ok); font-weight:600; }
  .folha .botao.vermelho { color:var(--alerta); border-color:var(--alerta); }
  .marcas { display:flex; flex-direction:column; gap:6px; }
  .marcas label { display:flex; align-items:center; gap:10px; border:1px solid var(--linha); border-radius:10px; padding:12px; cursor:pointer; }
  .marcas input { width:20px; height:20px; }
  .contagem { display:flex; gap:6px; flex-wrap:wrap; }
</style>
</head>
<body>
<header><h1>Presença</h1><a href="turno.html">Voltar</a></header>
<main>
  <div class="cartao"><h2 id="data"></h2><p class="suave">Toque no nome de cada pessoa.</p><div class="contagem" id="contagem"></div></div>
  <div id="pessoas" style="display:flex;flex-direction:column;gap:8px"></div>
</main>

<div class="fundo-folha" id="fundo" hidden>
  <div class="folha" id="folha"></div>
</div>

<script type="module">
import { exigirUsuario, hoje, dataBR } from "./js/sessao.js";
import { EQUIPE_DO_TURNO, pode } from "./js/equipe.js";
import { salvarComHistorico, listar } from "./js/db.js";

const eu = await exigirUsuario();
if (!pode.marcarPresenca(eu)) location.href = "turno.html";
const data = hoje();
document.getElementById("data").textContent = `Dia ${dataBR(data)}`;

// Problemas de apresentação que podem ser marcados para quem veio.
const PROBLEMAS = [
  ["chinelo", "Veio de chinelo"],
  ["sem_uniforme", "Sem uniforme completo"],
  ["sem_touca", "Sem touca / rede"],
  ["atrasou", "Chegou atrasada(o)"],
];
const rotuloProblema = Object.fromEntries(PROBLEMAS);

const registros = Object.fromEntries((await listar("presenca", "data", data)).map((r) => [r.pessoa, r]));
const lista = document.getElementById("pessoas");
const fundo = document.getElementById("fundo");
const folha = document.getElementById("folha");

function resumo(r) {
  if (!r) return ["Marcar", "pendente"];
  if (r.situacao === "veio") {
    const hora = r.chegada ? `${r.chegada} · ` : "";
    if (!r.problemas?.length) return [`${hora}Veio, tudo certo`, "ok"];
    return [hora + r.problemas.map((p) => rotuloProblema[p]).join(", "), "alerta"];
  }
  return ({ faltou: ["Faltou", "alerta"], atestado: ["Atestado", "neutro"], folga: ["Folga", "neutro"] })[r.situacao];
}

function desenhar() {
  lista.innerHTML = "";
  let setorAtual = "";
  for (const p of EQUIPE_DO_TURNO) {
    if (p.setor !== setorAtual) {
      setorAtual = p.setor;
      const t = document.createElement("p");
      t.className = "suave";
      t.style.cssText = "margin:8px 0 0;font-weight:600;text-transform:uppercase;letter-spacing:.05em";
      t.textContent = setorAtual;
      lista.append(t);
    }
    const [texto, tipo] = resumo(registros[p.nome]);
    const b = document.createElement("button");
    b.className = "linha";
    b.innerHTML = `<span><b>${p.nome}</b> <span class="suave">· ${p.setor}</span></span><span class="estado ${tipo}">${texto}</span>`;
    b.onclick = () => abrir(p);
    lista.append(b);
  }
  const feitos = EQUIPE_DO_TURNO.filter((p) => registros[p.nome]).length;
  const faltas = Object.values(registros).filter((r) => r.situacao === "faltou").length;
  const problemas = Object.values(registros).filter((r) => r.problemas?.length).length;
  document.getElementById("contagem").innerHTML =
    `<span class="estado pendente">${feitos} de ${EQUIPE_DO_TURNO.length} marcados</span>` +
    (faltas ? `<span class="estado alerta">${faltas} falta(s)</span>` : "") +
    (problemas ? `<span class="estado alerta">${problemas} com problema</span>` : "");
}

function fechar() { fundo.hidden = true; }
fundo.onclick = (e) => { if (e.target === fundo) fechar(); };

let chegada = null; // hora de chegada escolhida na folha

async function gravar(p, situacao, problemas = [], obs = "") {
  const registro = { data, pessoa: p.nome, setor: p.setor, situacao, problemas, obs,
    chegada: situacao === "veio" ? chegada : null, marcadoPor: eu.nome, marcadoPorUid: eu.uid, marcadoEm: new Date().toISOString() };
  try {
    await salvarComHistorico("presenca", `${data}_${p.nome}`, registro);
    registros[p.nome] = registro;
    fechar();
    desenhar();
  } catch {
    alert("Não consegui salvar. Verifique a internet e tente de novo.");
  }
}

// Primeira tela da folha: as opções principais.
function agora() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function abrir(p) {
  chegada = registros[p.nome]?.chegada || agora();
  folha.innerHTML = `
    <h2>${p.nome}</h2>
    <label class="campo" style="margin:0 0 4px">Chegou às <input type="time" id="chegada" value="${chegada}"></label>
    <button class="botao verde" data-acao="ok">Veio, tudo certo</button>
    <button class="botao" data-acao="problema">Veio, com problema…</button>
    <button class="botao vermelho" data-acao="faltou">Faltou</button>
    <button class="botao" data-acao="atestado">Atestado</button>
    <button class="botao" data-acao="folga">Folga</button>
    <button class="botao" data-acao="fechar" style="border:none">Cancelar</button>`;
  folha.querySelector("#chegada").onchange = (e) => { chegada = e.target.value || null; };
  folha.onclick = (e) => {
    const acao = e.target.closest("[data-acao]")?.dataset.acao;
    if (acao === "ok") gravar(p, "veio");
    else if (acao === "problema") abrirProblemas(p);
    else if (acao === "faltou" || acao === "atestado" || acao === "folga") gravar(p, acao);
    else if (acao === "fechar") fechar();
  };
  fundo.hidden = false;
}

// Segunda tela: marcar o que estava errado.
function abrirProblemas(p) {
  const atual = registros[p.nome];
  folha.innerHTML = `
    <h2>${p.nome}: o que estava errado?</h2>
    <div class="marcas">${PROBLEMAS.map(([v, t]) =>
      `<label><input type="checkbox" value="${v}" ${atual?.problemas?.includes(v) ? "checked" : ""}>${t}</label>`).join("")}</div>
    <input type="text" id="obs" placeholder="Observação (opcional)" value="${atual?.obs || ""}">
    <button class="botao principal" data-acao="salvar">Salvar</button>
    <button class="botao" data-acao="voltar" style="border:none">Voltar</button>`;
  folha.onclick = (e) => {
    const acao = e.target.closest("[data-acao]")?.dataset.acao;
    if (acao === "voltar") abrir(p);
    if (acao === "salvar") {
      const marcados = [...folha.querySelectorAll("input[type=checkbox]:checked")].map((i) => i.value);
      if (!marcados.length) return alert("Marque pelo menos um problema, ou volte e escolha \"Veio, tudo certo\".");
      gravar(p, "veio", marcados, folha.querySelector("#obs").value.trim());
    }
  };
}

desenhar();
</script>
</body>
</html>
