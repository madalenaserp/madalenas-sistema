<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madalena's · Meu turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Amaranth:ital,wght@1,700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2c180e">
<link rel="icon" href="icone.png"><link rel="apple-touch-icon" href="icone.png"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header><div data-logo="pequeno"></div><h1>Meu turno</h1><button id="sair">Sair</button></header>
<main>
  <div class="cartao"><h2 id="ola"></h2><p class="suave" id="data"></p></div>
  <div id="teste"></div>
  <div id="secoes" style="display:flex;flex-direction:column;gap:8px"></div>
</main>
<script type="module" src="js/marca.js"></script>
<script type="module">
import { exigirUsuario, sair, hoje, dataBR } from "./js/sessao.js";
import { pode } from "./js/equipe.js";
import { modoTeste } from "./js/db.js";

const eu = await exigirUsuario();
document.getElementById("ola").textContent = `Olá, ${eu.nome}`;
document.getElementById("data").textContent = `Hoje: ${dataBR(hoje())}`;
document.getElementById("sair").onclick = sair;
if (modoTeste) document.getElementById("teste").innerHTML =
  `<div class="aviso">Modo teste: os dados ficam só neste aparelho até o Firebase ser ligado.</div>`;

// Cada seção é uma tela separada. As que ainda não existem aparecem como "em breve".
const secoes = [
  { titulo: "Presença e apresentação", desc: "Quem veio, faltou, folga, uniforme e sapato", link: "presenca.html", mostrar: pode.marcarPresenca(eu) },
  { titulo: "Livro do dia", desc: pode.verLivroCompleto(eu) ? "Ordens, ocorrências, passagem e fechamento" : "Ordens para você hoje", link: "livro.html" },
  { titulo: "Consumo da equipe", desc: "O que cada funcionário consumiu e como pagou", link: "consumo.html", mostrar: pode.verConsumo(eu) },
  { titulo: "Minhas tarefas de hoje", desc: "Rodízio de limpeza e organização", emBreve: true },
  { titulo: "Checklists", desc: "Abertura, rondas e fechamento do salão e do caixa", link: "checklists.html" },
  { titulo: "Notas das empresas", desc: "Foto da nota assinada de cada empresa", link: "notas.html", mostrar: pode.notasEmpresas(eu) },
  { titulo: "Encomendas", desc: "Anotar, conferir e acompanhar até a entrega", link: "encomendas.html" },
  { titulo: "Minha escala", desc: "Seus dias de trabalho e folga", link: "escala.html", mostrar: !pode.rh(eu) },
  { titulo: "RH", desc: "Escala da semana, logins da equipe e mais", link: "rh.html", mostrar: pode.rh(eu) },
  { titulo: "Painel da Daiane", desc: "Resumo do que precisa de atenção", link: "painel.html", mostrar: pode.verPainel(eu) },
];
const lista = document.getElementById("secoes");
for (const s of secoes) {
  if ("mostrar" in s && !s.mostrar) continue;
  const a = document.createElement("a");
  a.className = "botao";
  a.href = s.link || "#";
  if (s.emBreve) a.setAttribute("aria-disabled", "true");
  a.innerHTML = `<b>${s.titulo}</b>${s.emBreve ? '<span class="selo pendente">em breve</span>' : ""}<br><span class="suave">${s.desc}</span>`;
  lista.append(a);
}
</script>
</body>
</html>
